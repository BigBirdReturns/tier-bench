[project]
name = "tier-bench"
version = "0.1.0"
description = "Deterministic LLM benchmark harness with tier-based routing and cost-per-success metrics."
requires-python = ">=3.10"
# Runtime cores remain dependency-free. Provider adapters and developer tooling
# are opt-in, while Surface Interop ships on the Python standard library.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["ruff>=0.6.0"]

[project.scripts]
capability-harness = "capability_harness.__main__:main"
tier = "tier_runner.cli:main"
tierdesk = "tier_runner.desk:main"
tierresidue = "tier_runner.residue_cli:main"
tierwaterline = "tier_runner.model_waterline:main"
tierplane = "tier_runner.sovereign_plane:main"
tierdistill = "tier_runner.distillation_lab:main"
tiertheory = "tier_runner.sovereign_theory:main"
tieratlas = "tier_runner.experience_atlas:main"
tierkimi = "tier_runner.kimi3_observatory:main"
tierfloor = "tier_runner.model_floor_cli:main"
estate-lab = "estate_lab.cli:main"
surface-interop = "estate_lab.production_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "capability_harness",
  "tier_runner",
  "tier_runner.adapters",
  "estate_lab",
]
include-package-data = true

[tool.setuptools.package-data]
estate_lab = [
  "*.md",
  "VERSION",
  "schemas/*.json",
  "contracts/*.json",
  "fixtures/*.json",
  "fixtures/scenarios/*.json",
  "fixtures/floor/*.json",
  "fixtures/floor/vectors/*.json",
  "fixtures/floor/reference-adapter/*.json",
  "fixtures/floor/reference-adapter/*.py",
  "fixtures/floor/reference-adapter/*.md",
  "wit/*.wit",
]

[tool.ruff]
line-length = 100
