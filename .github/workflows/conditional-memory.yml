name: conditional-memory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependency-free Tier Bench package
        run: python -m pip install -e .
      - name: Compile conditional-memory surfaces
        run: >-
          python -m py_compile
          tier_runner/conditional_memory_common.py
          tier_runner/conditional_memory_schema.py
          tier_runner/conditional_memory_plan.py
          tier_runner/conditional_memory_hardware.py
          tier_runner/conditional_memory_models.py
          tier_runner/conditional_memory_runner.py
          tier_runner/conditional_memory_pack.py
          tier_runner/conditional_memory_report.py
          tier_runner/conditional_memory_cli.py
          tests/test_conditional_memory.py
      - name: Run zero-model controls and optional PyTorch smoke
        run: python tests/test_conditional_memory.py
      - name: Freeze and verify the smoke matrix
        shell: bash
        run: |
          python -m tier_runner.conditional_memory_cli validate \
            --lab experiments/conditional_memory/lab.example.json \
            --profile smoke
          python -m tier_runner.conditional_memory_cli plan \
            --lab experiments/conditional_memory/lab.example.json \
            --profile smoke \
            --out conditional-memory-smoke-plan.json
          python -m tier_runner.conditional_memory_cli verify-plan \
            --lab experiments/conditional_memory/lab.example.json \
            --plan conditional-memory-smoke-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("conditional-memory-smoke-plan.json").read_text())
          assert len(plan["trials"]) == 14
          assert all(
              counts == {"gpu.3090-a": 1, "gpu.3090-b": 1}
              for counts in plan["pairing"]["seat_counts"].values()
          )
          assert plan["resolved"]["promotion"]["min_complete_seeds"] == 3
          print("CONDITIONAL_MEMORY_PLAN_OK", plan["plan_sha256"])
          PY
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/run-conditional-memory-lab.ps1),
            [ref]$Tokens,
            [ref]$Errors
          )
          if ($Errors.Count -gt 0) {
            $Errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "CONDITIONAL_MEMORY_POWERSHELL_OK"
