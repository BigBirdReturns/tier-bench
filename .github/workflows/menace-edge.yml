name: menace-edge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zero-model-calls:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile MENACE edge contracts
        run: |
          python -m py_compile \
            tier_runner/menace_edge_common.py \
            tier_runner/menace_edge_schema.py \
            tier_runner/menace_edge_plan.py \
            tier_runner/menace_edge_analysis.py \
            tier_runner/menace_edge.py \
            tier_runner/menace_seam_schema.py \
            tier_runner/menace_seam_plan.py \
            tier_runner/menace_seams.py \
            tests/test_menace_edge.py \
            tests/test_menace_seams.py

      - name: Exercise zero-model-call laws
        run: |
          python tests/test_menace_edge.py
          python tests/test_menace_seams.py

      - name: Compile and verify MENACE-EDGE-01
        run: |
          mkdir -p /tmp/menace-edge-evidence
          python -m tier_runner.menace_edge validate \
            --manifest experiments/menace_edge/menace_edge_01.json \
            | tee /tmp/menace-edge-evidence/validation.json
          python -m tier_runner.menace_edge plan \
            --manifest experiments/menace_edge/menace_edge_01.json \
            --out /tmp/menace-edge-evidence/plan.json
          python -m tier_runner.menace_edge verify \
            --manifest experiments/menace_edge/menace_edge_01.json \
            --plan /tmp/menace-edge-evidence/plan.json \
            | tee /tmp/menace-edge-evidence/verification.json
          python -m tier_runner.menace_edge templates \
            --plan /tmp/menace-edge-evidence/plan.json \
            --out /tmp/menace-edge-evidence/observation-templates.json
          cp experiments/menace_edge/menace_edge_01.json \
            /tmp/menace-edge-evidence/manifest.json

      - name: Compile donor piles, Venn census, and minimal witness plan
        run: |
          python -m tier_runner.menace_seams validate \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            | tee /tmp/menace-edge-evidence/seam-validation.json
          python -m tier_runner.menace_seams plan \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --out /tmp/menace-edge-evidence/minimal-witness-plan.json
          python -m tier_runner.menace_seams verify \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --plan /tmp/menace-edge-evidence/minimal-witness-plan.json \
            | tee /tmp/menace-edge-evidence/seam-plan-verification.json
          python -m tier_runner.menace_seams report \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --out-json /tmp/menace-edge-evidence/seam-census-report.json \
            --out-markdown /tmp/menace-edge-evidence/SEAM_CENSUS.md
          python -m tier_runner.menace_seams verify-report \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --report /tmp/menace-edge-evidence/seam-census-report.json \
            | tee /tmp/menace-edge-evidence/seam-report-verification.json
          cmp \
            experiments/menace_edge/minimal_witness_plan.json \
            /tmp/menace-edge-evidence/minimal-witness-plan.json
          cmp \
            experiments/menace_edge/seam_census_report.json \
            /tmp/menace-edge-evidence/seam-census-report.json
          cmp \
            experiments/menace_edge/SEAM_CENSUS.md \
            /tmp/menace-edge-evidence/SEAM_CENSUS.md
          cp experiments/menace_edge/donor_piles.json \
            /tmp/menace-edge-evidence/donor-piles.json
          cp experiments/menace_edge/seam_catalog.json \
            /tmp/menace-edge-evidence/seam-catalog.json
          cp experiments/menace_edge/coverage_matrix.json \
            /tmp/menace-edge-evidence/coverage-matrix.json
          git rev-parse HEAD > /tmp/menace-edge-evidence/repository-head.txt

      - name: Verify exact campaign and seam shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/menace-edge-evidence")
          plan = json.loads((root / "plan.json").read_text())
          templates = json.loads((root / "observation-templates.json").read_text())
          seam_plan = json.loads((root / "minimal-witness-plan.json").read_text())
          seam_report = json.loads((root / "seam-census-report.json").read_text())

          assert plan["schema"] == "tier-bench/menace-edge-plan@1"
          assert plan["totals"]["cells"] == 315
          assert plan["totals"]["connectivity_steps"] == 9
          assert len(templates) == 315
          assert all(row["status"] == "unmeasured" for row in templates)

          assert seam_report["totals"]["donor_piles"] == 6
          assert seam_report["totals"]["donors"] == 18
          assert seam_report["totals"]["seams"] == 18
          assert seam_report["totals"]["negative_witnesses"] == 18
          assert seam_report["totals"]["coverage_witnesses"] == 8
          assert seam_report["totals"]["selected_witnesses"] == 5
          assert seam_report["uncovered_mandatory_seams"] == []
          assert seam_report["under_supported_mandatory_seams"] == []
          assert seam_plan["objective"]["total_cost_units"] == 31
          assert [row["id"] for row in seam_plan["selected_witnesses"]] == [
              "witness.cooperative-handoff",
              "witness.multi-role-handoff",
              "witness.partitioned-controller",
              "witness.physical-availability",
              "witness.stack-recovery",
          ]

          rendered = json.dumps({"campaign": plan, "seams": seam_report}, sort_keys=True)
          assert '"score"' not in rendered
          assert '"aggregate_score"' not in rendered
          assert seam_plan["production_claim"] is False
          assert seam_plan["promotion_authorized"] is False
          assert seam_report["production_claim"] is False
          assert seam_report["promotion_authorized"] is False
          PY
          find /tmp/menace-edge-evidence -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/menace-edge-evidence -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          (
            cd /tmp/menace-edge-evidence
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: menace-edge-python-${{ matrix.python-version }}
          path: /tmp/menace-edge-evidence
          if-no-files-found: error
