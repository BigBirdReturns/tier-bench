name: menace-edge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zero-model-calls:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile MENACE edge contracts
        run: |
          python -m py_compile \
            tier_runner/menace_edge_common.py \
            tier_runner/menace_edge_schema.py \
            tier_runner/menace_edge_plan.py \
            tier_runner/menace_edge_analysis.py \
            tier_runner/menace_edge.py \
            tests/test_menace_edge.py

      - name: Exercise zero-model-call laws
        run: python tests/test_menace_edge.py

      - name: Compile and verify MENACE-EDGE-01
        run: |
          mkdir -p /tmp/menace-edge-evidence
          python -m tier_runner.menace_edge validate \
            --manifest experiments/menace_edge/menace_edge_01.json \
            | tee /tmp/menace-edge-evidence/validation.json
          python -m tier_runner.menace_edge plan \
            --manifest experiments/menace_edge/menace_edge_01.json \
            --out /tmp/menace-edge-evidence/plan.json
          python -m tier_runner.menace_edge verify \
            --manifest experiments/menace_edge/menace_edge_01.json \
            --plan /tmp/menace-edge-evidence/plan.json \
            | tee /tmp/menace-edge-evidence/verification.json
          python -m tier_runner.menace_edge templates \
            --plan /tmp/menace-edge-evidence/plan.json \
            --out /tmp/menace-edge-evidence/observation-templates.json
          cp experiments/menace_edge/menace_edge_01.json \
            /tmp/menace-edge-evidence/manifest.json
          git rev-parse HEAD > /tmp/menace-edge-evidence/repository-head.txt

      - name: Verify exact campaign shape and clean evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/menace-edge-evidence")
          plan = json.loads((root / "plan.json").read_text())
          templates = json.loads((root / "observation-templates.json").read_text())
          assert plan["schema"] == "tier-bench/menace-edge-plan@1"
          assert plan["totals"]["cells"] == 315
          assert plan["totals"]["connectivity_steps"] == 9
          assert len(templates) == 315
          assert all(row["status"] == "unmeasured" for row in templates)
          rendered = json.dumps(plan, sort_keys=True)
          assert '"score"' not in rendered
          assert '"aggregate_score"' not in rendered
          PY
          find /tmp/menace-edge-evidence -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/menace-edge-evidence -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          (
            cd /tmp/menace-edge-evidence
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: menace-edge-python-${{ matrix.python-version }}
          path: /tmp/menace-edge-evidence
          if-no-files-found: error
