name: residue-refinery

on:
  pull_request:
  workflow_dispatch:

jobs:
  zero-model-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile refinery and shared broker policy
        run: |
          python -m py_compile \
            tier_runner/residue.py \
            tier_runner/residue_cli.py \
            tier_runner/residue_policy.py \
            tier_runner/residue_resources.py \
            experiments/breadth/residue_broker.py \
            tests/test_residue_refinery.py \
            tests/test_residue_resources.py
      - name: Preserve ARC-C broker behavior
        run: python tests/test_residue_broker.py
      - name: Preserve Monster Wrangler behavior
        run: python tests/test_tier_desk.py
      - name: Exercise local-first and survey campaigns
        run: python tests/test_residue_refinery.py
      - name: Serialize shared GPUs and admit independent lanes
        run: python tests/test_residue_resources.py
