name: Converge Supplier Foundry Asset Floor v1

on:
  push:
    branches:
      - agent/supplier-foundry-asset-floor-v1
    paths:
      - '.github/workflows/converge-supplier-foundry-asset-floor.yml'
      - '.asset-floor-payload/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/converge-supplier-foundry-asset-floor.yml'
      - '.asset-floor-payload/**'
      - 'supplier_foundry/floor/**'

permissions:
  contents: write

concurrency:
  group: converge-supplier-foundry-asset-floor-v1
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-foundry-asset-floor-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate the reviewed Asset Floor estate
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-floor-payload/part-* | base64 --decode > "$RUNNER_TEMP/asset-floor.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/asset-floor.tar.gz" | cut -d' ' -f1)" = "2c49eabc4bc5df6610ed33c7196775122a1e263480156196f13e574151e83190"
          tar -xzf "$RUNNER_TEMP/asset-floor.tar.gz"
          test -f supplier_foundry/floor/asset_floor.py
          test -f supplier_foundry/floor/catalog.json
          test -f supplier_foundry/floor/examples/floor-report.json
          test -f .github/workflows/supplier-foundry-asset-floor.yml
          ! find supplier_foundry/floor -type d -name __pycache__ -print -quit | grep -q .

      - name: Qualify the provider-neutral floor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile supplier_foundry/floor/asset_floor.py
          python -m unittest discover -s supplier_foundry/floor/tests -v
          if test -d supplier_foundry/tests; then
            python -m unittest discover -s supplier_foundry/tests -v
          fi
          python supplier_foundry/floor/asset_floor.py validate \
            supplier_foundry/floor/catalog.json \
            supplier_foundry/floor/examples/underdrain-valve.asset-intent.json \
            supplier_foundry/floor/examples/underdrain-boss-toad.asset-intent.json
          python supplier_foundry/floor/asset_floor.py report \
            --catalog supplier_foundry/floor/catalog.json \
            --intent supplier_foundry/floor/examples/underdrain-valve.asset-intent.json \
            --intent supplier_foundry/floor/examples/underdrain-boss-toad.asset-intent.json \
            --output "$RUNNER_TEMP/floor-report.json"
          cmp "$RUNNER_TEMP/floor-report.json" supplier_foundry/floor/examples/floor-report.json
          git diff --check

      - name: Publish one carrier-free implementation commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-floor-payload supplier_foundry/floor/__pycache__ supplier_foundry/floor/tests/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/converge-supplier-foundry-asset-floor.yml
          git add supplier_foundry/floor .github/workflows/supplier-foundry-asset-floor.yml
          git diff --cached --check
          git commit -m 'Build the provider-neutral AXM Asset Floor v1'
          git push origin HEAD:agent/supplier-foundry-asset-floor-v1
