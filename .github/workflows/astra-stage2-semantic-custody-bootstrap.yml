name: astra-stage2-semantic-custody-bootstrap

on:
  push:
    branches:
      - assist/astra-stage2-semantic-custody-49cd-20260903

permissions:
  contents: read

concurrency:
  group: astra-stage2-semantic-custody-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-qualified-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact staging head
        id: custody
        shell: bash
        env:
          ASSIST_BRANCH: assist/astra-stage2-semantic-custody-49cd-20260903
          EXPECTED_STAGING_HEAD: ${{ github.sha }}
          TARGET_HEAD: 49cd5999437c4eb797073357cc1c17685e4a1895
          TARGET_TREE: dcaee26ad123842c325909f4a083eb9a1d76c7dc
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=96 origin \
            "+refs/heads/${ASSIST_BRANCH}:refs/bootstrap/candidate"
          git checkout --detach refs/bootstrap/candidate
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGING_HEAD"
          git merge-base --is-ancestor "$TARGET_HEAD" HEAD
          test "$(git rev-parse "${TARGET_HEAD}^{tree}")" = "$TARGET_TREE"
          printf 'staging_head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'staging_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Reconstruct and validate payload
        shell: bash
        run: |
          set -euo pipefail
          for part in \
            .assist/payload-part-00a \
            .assist/payload-part-00b \
            .assist/payload-part-01 \
            .assist/payload-part-02 \
            .assist/payload-part-03 \
            .assist/payload-part-04 \
            .assist/payload-part-05 \
            .assist/payload-part-06 \
            .assist/payload-part-07
          do
            test -f "$part"
          done
          cat > "$RUNNER_TEMP/expected-parts.sha256" <<'EOF'
          a6247912e1ce48aac2723fe02727152967e4ff10580de0112652af20137438b9  .assist/payload-part-00a
          8df1e80d2f1f22ae816feff16a6e95b1f0cc6547f3026bbfcb4f54b4920cb1a0  .assist/payload-part-00b
          950178e5895896d8d37251aca8bbd4cb807d7a1acd8ff7ac573c2a15e161aef3  .assist/payload-part-01
          84e64d7ae6f156b4378fca71e3182d0e10944597523874284ea9a1035de7558c  .assist/payload-part-02
          4dc944895948208dca3b8b7463c37db604e18a6480e713ea330ee86a7e8377af  .assist/payload-part-03
          2cc94b4d66cc776fb4aaad2e23988da8ac23bde36522ab6a37a12a5cbf8beb14  .assist/payload-part-04
          d574a80a8b928fcce3f9c6ef80b8e08700f86cad2d702f64fdfbd2e4d281de0d  .assist/payload-part-05
          f1a7dc54756400a446a505dd446cd4dc9596669e2067bc4987a675b6f26eaabe  .assist/payload-part-06
          cac12dd59c85847d60d51908041cc60538993c2fe8a8af15512c4fe4cffa9be1  .assist/payload-part-07
          EOF
          sha256sum -c "$RUNNER_TEMP/expected-parts.sha256"
          cat \
            .assist/payload-part-00a \
            .assist/payload-part-00b \
            .assist/payload-part-01 \
            .assist/payload-part-02 \
            .assist/payload-part-03 \
            .assist/payload-part-04 \
            .assist/payload-part-05 \
            .assist/payload-part-06 \
            .assist/payload-part-07 \
            > "$RUNNER_TEMP/payload.b64"
          echo "8c8369de2640287eda98fefed3f6f0154f82e5f1b7ae1f49088d07172097586d  $RUNNER_TEMP/payload.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.gz"
          echo "1ae61c10d8b6b5c46aa0e404a4f5174b7bb4aea459233c35b02213594b2a5000  $RUNNER_TEMP/payload.tar.gz" | sha256sum -c -
          python3 - "$RUNNER_TEMP/payload.tar.gz" <<'PY'
          import pathlib
          import sys
          import tarfile

          expected = {
              ".github/workflows/astra-stage2-semantic-custody-assist.yml",
              "astra_stage2/calibration.py",
              "astra_stage2/ci_runner.py",
              "astra_stage2/cli.py",
              "astra_stage2/contracts.py",
              "schemas/astra-stage2-calibration-result.schema.json",
              "tests/test_astra_stage2_calibration.py",
          }
          archive_path = pathlib.Path(sys.argv[1])
          with tarfile.open(archive_path, "r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f"payload path set mismatch: {sorted(names)}")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe payload member: {member.name}")
              archive.extractall(".", filter="data")
          PY

      - name: Validate exact final tree
        id: final
        shell: bash
        env:
          TARGET_HEAD: 49cd5999437c4eb797073357cc1c17685e4a1895
          TARGET_TREE: dcaee26ad123842c325909f4a083eb9a1d76c7dc
        run: |
          set -euo pipefail
          rm -rf .assist
          rm -f .github/workflows/astra-stage2-semantic-custody-bootstrap.yml
          git diff --check "$TARGET_HEAD" --
          python3 -m py_compile astra_stage2/*.py tests/test_astra_stage2_calibration.py
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_astra_stage2_calibration.py' -v 2>&1 | tee "$RUNNER_TEMP/semantic-custody-tests.log"
          grep -q '^Ran 27 tests in ' "$RUNNER_TEMP/semantic-custody-tests.log"
          mapfile -t observed < <(git diff --name-only "$TARGET_HEAD" -- | sort)
          printf '%s\n' \
            '.github/workflows/astra-stage2-semantic-custody-assist.yml' \
            'astra_stage2/calibration.py' \
            'astra_stage2/ci_runner.py' \
            'astra_stage2/cli.py' \
            'astra_stage2/contracts.py' \
            'schemas/astra-stage2-calibration-result.schema.json' \
            'tests/test_astra_stage2_calibration.py' | sort > "$RUNNER_TEMP/expected-final-paths.txt"
          printf '%s\n' "${observed[@]}" > "$RUNNER_TEMP/observed-final-paths.txt"
          diff -u "$RUNNER_TEMP/expected-final-paths.txt" "$RUNNER_TEMP/observed-final-paths.txt"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only "$TARGET_HEAD" -- | sort)
          test "${#staged[@]}" -eq 7
          printf '%s\n' "${staged[@]}" > "$RUNNER_TEMP/staged-final-paths.txt"
          diff -u "$RUNNER_TEMP/expected-final-paths.txt" "$RUNNER_TEMP/staged-final-paths.txt"
          final_tree="$(git write-tree)"
          printf 'final_tree=%s\n' "$final_tree" >> "$GITHUB_OUTPUT"

      - name: Package exact final tree
        id: package
        shell: bash
        env:
          TARGET_HEAD: 49cd5999437c4eb797073357cc1c17685e4a1895
          TARGET_TREE: dcaee26ad123842c325909f4a083eb9a1d76c7dc
          STAGING_HEAD: ${{ steps.custody.outputs.staging_head }}
          STAGING_TREE: ${{ steps.custody.outputs.staging_tree }}
          FINAL_TREE: ${{ steps.final.outputs.final_tree }}
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/semantic-custody-export"
          payload_root="$export_root/payload"
          mkdir -p "$payload_root"
          while IFS= read -r path
          do
            install -D -m 0644 "$path" "$payload_root/$path"
          done < "$RUNNER_TEMP/expected-final-paths.txt"
          cp "$RUNNER_TEMP/payload.tar.gz" "$export_root/payload.tar.gz"
          cp "$RUNNER_TEMP/semantic-custody-tests.log" "$export_root/semantic-custody-tests.log"
          cp "$RUNNER_TEMP/expected-final-paths.txt" "$export_root/expected-final-paths.txt"
          cp "$RUNNER_TEMP/observed-final-paths.txt" "$export_root/observed-final-paths.txt"
          cp "$RUNNER_TEMP/staged-final-paths.txt" "$export_root/staged-final-paths.txt"
          python3 - "$export_root" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          payload_root = root / "payload"
          files = {}
          for path in sorted(p for p in payload_root.rglob("*") if p.is_file()):
              data = path.read_bytes()
              files[path.relative_to(payload_root).as_posix()] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "record_type": "tier-bench/astra-stage2-semantic-custody-export@1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "target_head": os.environ["TARGET_HEAD"],
              "target_tree": os.environ["TARGET_TREE"],
              "staging_head": os.environ["STAGING_HEAD"],
              "staging_tree": os.environ["STAGING_TREE"],
              "final_tree": os.environ["FINAL_TREE"],
              "payload_tar_sha256": hashlib.sha256((root / "payload.tar.gz").read_bytes()).hexdigest(),
              "test_log_sha256": hashlib.sha256((root / "semantic-custody-tests.log").read_bytes()).hexdigest(),
              "path_count": len(files),
              "files": files,
              "tests": 27,
              "provider_or_model_calls": 0,
              "empirical_execution": False,
              "merge_authority": "NONE",
          }
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
          manifest["payload_sha256"] = hashlib.sha256(canonical).hexdigest()
          (root / "export-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          (
            cd "$export_root"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          printf 'export_root=%s\n' "$export_root" >> "$GITHUB_OUTPUT"
          cat "$export_root/export-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact final tree
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-stage2-semantic-custody-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.export_root }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: true

      - name: Seal export coordinate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.artifact.outputs.artifact-id }}"
          test -n "${{ steps.artifact.outputs.artifact-digest }}"
          {
            echo
            echo "artifact_id=${{ steps.artifact.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.artifact.outputs.artifact-digest }}"
            echo "staging_head=${{ steps.custody.outputs.staging_head }}"
            echo "staging_tree=${{ steps.custody.outputs.staging_tree }}"
            echo "final_tree=${{ steps.final.outputs.final_tree }}"
          } >> "$GITHUB_STEP_SUMMARY"
