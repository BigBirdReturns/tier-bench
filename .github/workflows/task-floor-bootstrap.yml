name: task-floor-bootstrap

on:
  push:
    branches: [agent/task-floor-v1]
  pull_request:
    branches: [agent/task-computer-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-floor-v1
      - name: Expand Task Floor source
        shell: bash
        run: |
          set -euo pipefail
          cat .task-floor-bootstrap.part-* | base64 -d > /tmp/task-floor.tar.gz
          echo "ffac1d11f4d2d3a3977d0c64c4d097ff461176579ace459b1da204d3bed277d1  /tmp/task-floor.tar.gz" | sha256sum -c -
          tar -xzf /tmp/task-floor.tar.gz -C .
          rm -f .task-floor-bootstrap.part-* .github/workflows/task-floor-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish the Task Floor interoperability layer"
          git push origin HEAD:agent/task-floor-v1
