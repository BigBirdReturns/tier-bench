name: One-shot Estate Lab commodity sweep carrier

on:
  push:
    branches: [agent/axm-estate-lab]
    paths: ['.commodity-sweep-trigger']
  pull_request:
    branches: [main]
    paths: ['.commodity-sweep-trigger']

permissions:
  contents: write

concurrency:
  group: commodity-sweep-publication-carrier
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/axm-estate-lab
          fetch-depth: 0

      - id: gate
        name: Check whether source publication is still required
        shell: bash
        run: |
          if grep -qx '0.2.0' estate_lab/VERSION; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.gate.outputs.required == 'true'
        name: Materialize reviewed commodity sweep
        shell: bash
        run: |
          set -euo pipefail
          cat .commodity-sweep-payload-* | base64 -d > "$RUNNER_TEMP/commodity-sweep.tar.xz"
          echo "c8611963179728eb906f3878afe463f2897fa724387e4cf8557b283358abfd56  $RUNNER_TEMP/commodity-sweep.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/commodity-sweep.tar.xz"

      - if: steps.gate.outputs.required == 'true'
        name: Qualify Estate Lab 0.2
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile estate_lab/*.py estate_lab/scripts/run_reference_lab.py
          python -m estate_lab validate
          python -m estate_lab commodities --format json > "$RUNNER_TEMP/commodity-plan.json"
          python -m unittest discover -s estate_lab/tests -v
          rm -rf "$RUNNER_TEMP/estate-lab-runs"
          python -m estate_lab run-all --output "$RUNNER_TEMP/estate-lab-runs"
          git diff --check

      - if: steps.gate.outputs.required == 'true'
        name: Publish source without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estate_lab
          git commit -m 'Add the OSS and commodity acquisition ledger'
          git push origin HEAD:agent/axm-estate-lab
