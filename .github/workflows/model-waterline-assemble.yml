name: diagnose-model-waterline-payload

on:
  push:
    branches: [agent/model-waterline-observatory-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/model-waterline-observatory-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inventory exact payload chunks
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path(".").resolve()
          carriers = sorted((root / "transport").glob("model_waterline_payload.part-*.b64"))
          records = []
          parts = []
          for path in carriers:
              raw = path.read_text(encoding="ascii")
              normalized = "".join(raw.split())
              if normalized:
                  parts.append(normalized)
              records.append({
                  "path": path.as_posix(),
                  "raw_length": len(raw),
                  "normalized_length": len(normalized),
                  "raw_sha256": hashlib.sha256(raw.encode()).hexdigest(),
                  "normalized_sha256": hashlib.sha256(normalized.encode()).hexdigest(),
                  "prefix": normalized[:24],
                  "suffix": normalized[-24:],
              })
          encoded = "".join(parts)
          diagnosis = {
              "schema": "tier-bench/model-waterline-payload-diagnosis@1",
              "chunks": records,
              "combined_length": len(encoded),
              "combined_sha256": hashlib.sha256(encoded.encode()).hexdigest(),
              "expected_zip_sha256": "dfa594dc21813985970b9cd2fb85c0e2fe585b369602a970d0b30e609347da3f",
          }
          try:
              payload = base64.b64decode(encoded, validate=True)
              diagnosis["decoded_length"] = len(payload)
              diagnosis["decoded_sha256"] = hashlib.sha256(payload).hexdigest()
              diagnosis["decode_error"] = None
          except Exception as exc:
              diagnosis["decoded_length"] = None
              diagnosis["decoded_sha256"] = None
              diagnosis["decode_error"] = f"{type(exc).__name__}: {exc}"
          target = root / "transport/model_waterline_payload.diagnostic.json"
          target.write_text(json.dumps(diagnosis, indent=2, sort_keys=True) + "\n")
          print(json.dumps(diagnosis, indent=2, sort_keys=True))
          PY
      - name: Commit diagnosis for review
        run: |
          git config user.name "Model Waterline Diagnostic"
          git config user.email "model-waterline@users.noreply.github.com"
          git add transport/model_waterline_payload.diagnostic.json
          git diff --cached --quiet || git commit -m "Record model waterline payload diagnosis"
          git push origin HEAD:agent/model-waterline-observatory-v1
