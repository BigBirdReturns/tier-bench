name: build-astra-windows-topology-repair

on:
  push:
    branches:
      - repair/astra-stage2-windows-topology-builder-20260903

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build and test exact repair from B353
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_HEAD: b3534c9703723ac35343af0209edc34c7587173c
          BASE_TREE: 15f64f02f5dfc6b1e5e59634205dc7d157d9c125
          OUTPUT_BRANCH: repair/astra-stage2-windows-topology-ready-20260903
        run: |
          set -euo pipefail
          script_source="$PWD/.github/scripts/build_astra_windows_topology_repair.py"
          test -f "$script_source"
          cp "$script_source" "$RUNNER_TEMP/build_astra_windows_topology_repair.py"

          rm -rf .git .github scripts astra_stage2 experiments tests .gitattributes || true
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=128 origin \
            "+${BASE_HEAD}:refs/astra-topology/base"
          git checkout --detach refs/astra-topology/base
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"

          python3 "$RUNNER_TEMP/build_astra_windows_topology_repair.py"
          git diff --check

          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .gitattributes
          .github/workflows/astra-stage2-control-identity-release.yml
          astra_stage2/control_identity.py
          experiments/astra_kxr/stage2/control_identity/binding-template.json
          scripts/Invoke-AstraStage2ControlIdentityBinding.ps1
          tests/test_astra_stage2_control_identity.py
          tests/test_astra_stage2_control_identity_release.py
          EOF
          git diff --name-only | sort > "$RUNNER_TEMP/observed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/observed-paths.txt"

          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add -A
          git commit -m "fix(astra): bind truthful Windows single-device topology"

          python3 -m py_compile \
            astra_stage2/control_identity.py \
            scripts/astra_stage2_bind_controls.py \
            tests/test_astra_stage2_control_identity.py \
            tests/test_astra_stage2_control_identity_release.py
          PYTHONPATH=. python3 -m unittest discover \
            -s tests \
            -p 'test_astra_stage2_control_identity*.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/astra-topology-tests.log"
          grep -q '^Ran 32 tests in ' "$RUNNER_TEMP/astra-topology-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/astra-topology-tests.log"

          command -v pwsh >/dev/null
          ASTRA_RELEASE_LAUNCHER="$PWD/scripts/Invoke-AstraStage2ControlIdentityBinding.ps1" \
            pwsh -NoProfile -Command \
            '$ErrorActionPreference = "Stop"; $text = Get-Content -Raw -LiteralPath $env:ASTRA_RELEASE_LAUNCHER; [void][scriptblock]::Create($text); Write-Output "POWERSHELL_PARSE_PASS"'

          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git push --force origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          {
            echo "ready_branch=${OUTPUT_BRANCH}"
            echo "ready_head=${head}"
            echo "ready_tree=${tree}"
            echo "tests=32"
            echo "provider_or_model_calls=0"
          } >> "$GITHUB_STEP_SUMMARY"
