name: build-astra-windows-topology-repair

on:
  push:
    branches:
      - repair/astra-stage2-windows-topology-builder-20260903

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build and test exact repair from B353
        id: build
        shell: bash
        env:
          EXPECTED_BUILDER_HEAD: ${{ github.sha }}
          BUILDER_BRANCH: repair/astra-stage2-windows-topology-builder-20260903
          BASE_HEAD: b3534c9703723ac35343af0209edc34c7587173c
          BASE_TREE: 15f64f02f5dfc6b1e5e59634205dc7d157d9c125
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=128 origin \
            "+refs/heads/${BUILDER_BRANCH}:refs/astra-topology/builder" \
            "+${BASE_HEAD}:refs/astra-topology/base"
          git checkout --detach refs/astra-topology/builder
          test "$(git rev-parse HEAD)" = "$EXPECTED_BUILDER_HEAD"
          cp .github/scripts/build_astra_windows_topology_repair.py \
            "$RUNNER_TEMP/build_astra_windows_topology_repair.py"
          cp .github/scripts/correct_astra_windows_topology_materializer.py \
            "$RUNNER_TEMP/correct_astra_windows_topology_materializer.py"
          python3 "$RUNNER_TEMP/correct_astra_windows_topology_materializer.py" \
            "$RUNNER_TEMP/build_astra_windows_topology_repair.py"
          python3 -m py_compile "$RUNNER_TEMP/build_astra_windows_topology_repair.py"

          git checkout --detach refs/astra-topology/base
          git clean -ffd
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"

          python3 "$RUNNER_TEMP/build_astra_windows_topology_repair.py"
          git diff --check

          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .gitattributes
          .github/workflows/astra-stage2-control-identity-release.yml
          astra_stage2/control_identity.py
          experiments/astra_kxr/stage2/control_identity/binding-template.json
          scripts/Invoke-AstraStage2ControlIdentityBinding.ps1
          tests/test_astra_stage2_control_identity.py
          tests/test_astra_stage2_control_identity_release.py
          EOF
          git diff --name-only | sort > "$RUNNER_TEMP/observed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/observed-paths.txt"

          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add -A
          git commit -m "fix(astra): bind truthful Windows single-device topology"

          python3 -m py_compile \
            astra_stage2/control_identity.py \
            scripts/astra_stage2_bind_controls.py \
            tests/test_astra_stage2_control_identity.py \
            tests/test_astra_stage2_control_identity_release.py
          PYTHONPATH=. python3 -m unittest discover \
            -s tests \
            -p 'test_astra_stage2_control_identity*.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/astra-topology-tests.log"
          grep -q '^Ran 32 tests in ' "$RUNNER_TEMP/astra-topology-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/astra-topology-tests.log"

          command -v pwsh >/dev/null
          ASTRA_RELEASE_LAUNCHER="$PWD/scripts/Invoke-AstraStage2ControlIdentityBinding.ps1" \
            pwsh -NoProfile -Command \
            '$ErrorActionPreference = "Stop"; $text = Get-Content -Raw -LiteralPath $env:ASTRA_RELEASE_LAUNCHER; [void][scriptblock]::Create($text); Write-Output "POWERSHELL_PARSE_PASS"'

          ready_head="$(git rev-parse HEAD)"
          ready_tree="$(git rev-parse 'HEAD^{tree}')"
          export_root="$RUNNER_TEMP/astra-windows-topology-ready"
          mkdir -p "$export_root"
          while IFS= read -r path
          do
            install -D -m 0644 "$path" "$export_root/$path"
          done < "$RUNNER_TEMP/expected-paths.txt"
          cp "$RUNNER_TEMP/astra-topology-tests.log" "$export_root/test-astra-topology-linux.log"
          cat > "$export_root/coordinates.json" <<EOF
          {
            "parent_head": "${BASE_HEAD}",
            "parent_tree": "${BASE_TREE}",
            "ready_head": "${ready_head}",
            "ready_tree": "${ready_tree}",
            "tests": 32,
            "provider_or_model_calls": 0
          }
          EOF
          (
            cd "$export_root"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          printf 'export_root=%s\n' "$export_root" >> "$GITHUB_OUTPUT"
          {
            echo "ready_head=${ready_head}"
            echo "ready_tree=${ready_tree}"
            echo "tests=32"
            echo "provider_or_model_calls=0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested repair bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-windows-topology-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.export_root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
