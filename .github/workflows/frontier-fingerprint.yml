name: frontier-fingerprint

# Provider-free conformance only. The workflow checks out the exact source head,
# derives its closure ledger from runner outputs, and uploads only public-safe evidence.
on:
  pull_request:
    paths:
      - "frontier_fingerprint/**"
      - "scripts/frontier_fingerprint.py"
      - "scripts/frontier_qualification.py"
      - "tests/test_frontier_fingerprint.py"
      - "tests/test_frontier_qualification.py"
      - "experiments/frontier_fingerprint/**"
      - "schemas/frontier-fingerprint-*.schema.json"
      - ".github/workflows/frontier-fingerprint.yml"
      - "docs/agents/claims/SOL-FRONTIER-FINGERPRINT-1.md"
  push:
    branches:
      - main
      - codex/frontier-fingerprint-20260901
    paths:
      - "frontier_fingerprint/**"
      - "scripts/frontier_fingerprint.py"
      - "scripts/frontier_qualification.py"
      - "tests/test_frontier_fingerprint.py"
      - "tests/test_frontier_qualification.py"
      - "experiments/frontier_fingerprint/**"
      - "schemas/frontier-fingerprint-*.schema.json"
      - ".github/workflows/frontier-fingerprint.yml"
      - "docs/agents/claims/SOL-FRONTIER-FINGERPRINT-1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-fingerprint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-free-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_ROOT: ${{ runner.temp }}/frontier-fingerprint-qualification
      PRIVATE_RUN_ROOT: ${{ runner.temp }}/frontier-fingerprint-private

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Bind checkout, tree, base, and changed paths
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_ROOT" "$PRIVATE_RUN_ROOT"
          mkdir -p "$EVIDENCE_ROOT" "$PRIVATE_RUN_ROOT"

          observed_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_head="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_request"]["head"]["sha"])' "$GITHUB_EVENT_PATH")"
            base_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_request"]["base"]["sha"])' "$GITHUB_EVENT_PATH")"
            pr_number="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_request"]["number"])' "$GITHUB_EVENT_PATH")"
          else
            source_head="$GITHUB_SHA"
            pr_number=""
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            base_sha="$(git merge-base "$observed_head" refs/remotes/origin/main)"
          fi

          if [[ "$observed_head" != "$source_head" ]]; then
            echo "checkout custody mismatch: expected $source_head, observed $observed_head" >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          git diff --name-only -z "${base_sha}...${observed_head}" \
            > "$EVIDENCE_ROOT/changed-paths.z"
          test -s "$EVIDENCE_ROOT/changed-paths.z"

          printf 'source_head_sha=%s\n' "$source_head" >> "$GITHUB_OUTPUT"
          printf 'checked_out_sha=%s\n' "$observed_head" >> "$GITHUB_OUTPUT"
          printf 'tree_sha=%s\n' "$tree_sha" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Compile observatory and qualification controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frontier_fingerprint/*.py \
            scripts/frontier_fingerprint.py \
            scripts/frontier_qualification.py \
            tests/test_frontier_*.py

      - name: Run all frontier adversarial conformance tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_frontier_*.py' -v 2>&1 \
            | tee "$EVIDENCE_ROOT/test-frontier-suite.log"

      - name: Execute provider-free campaign from checked-out bytes
        shell: bash
        run: |
          set -euo pipefail
          run_dir="$PRIVATE_RUN_ROOT/run"
          python scripts/frontier_fingerprint.py plan \
            --manifest experiments/frontier_fingerprint/mock-smoke.json \
            --out "$EVIDENCE_ROOT/plan.json"
          python scripts/frontier_fingerprint.py run \
            --manifest experiments/frontier_fingerprint/mock-smoke.json \
            --out "$run_dir" \
            | tee "$EVIDENCE_ROOT/run-result.json"
          python scripts/frontier_fingerprint.py verify \
            --run-dir "$run_dir" \
            --out "$EVIDENCE_ROOT/verification.json"
          python scripts/frontier_fingerprint.py summarize \
            --run-dir "$run_dir" \
            --out "$EVIDENCE_ROOT/summary.json"
          python scripts/frontier_fingerprint.py passive \
            --input experiments/frontier_fingerprint/fixtures/passive-claude.jsonl \
            --adapter claude_code_jsonl \
            --out "$EVIDENCE_ROOT/passive-claude.json"
          python scripts/frontier_fingerprint.py passive \
            --input experiments/frontier_fingerprint/fixtures/passive-openai.jsonl \
            --adapter codex_jsonl \
            --out "$EVIDENCE_ROOT/passive-openai.json"
          cp "$run_dir/receipts.jsonl" "$EVIDENCE_ROOT/receipts.jsonl"

      - name: Derive and verify machine qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/frontier_qualification.py collect \
            --repository "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --pr-number "${{ steps.custody.outputs.pr_number }}" \
            --source-head-sha "${{ steps.custody.outputs.source_head_sha }}" \
            --checked-out-sha "${{ steps.custody.outputs.checked_out_sha }}" \
            --tree-sha "${{ steps.custody.outputs.tree_sha }}" \
            --base-sha "${{ steps.custody.outputs.base_sha }}" \
            --changed-paths-z "$EVIDENCE_ROOT/changed-paths.z" \
            --test-log "$EVIDENCE_ROOT/test-frontier-suite.log" \
            --run-result "$EVIDENCE_ROOT/run-result.json" \
            --verification "$EVIDENCE_ROOT/verification.json" \
            --summary "$EVIDENCE_ROOT/summary.json" \
            --plan "$EVIDENCE_ROOT/plan.json" \
            --receipts "$EVIDENCE_ROOT/receipts.jsonl" \
            --passive "$EVIDENCE_ROOT/passive-claude.json" \
            --passive "$EVIDENCE_ROOT/passive-openai.json" \
            --manifest-root experiments/frontier_fingerprint \
            --out "$EVIDENCE_ROOT/qualification-receipt.json"
          python scripts/frontier_qualification.py verify \
            --input "$EVIDENCE_ROOT/qualification-receipt.json" \
            --schema tier-bench/frontier-fingerprint-qualification@1
          cat "$EVIDENCE_ROOT/qualification-receipt.json"

      - name: Upload public-safe evidence
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-fingerprint-public-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/qualification-receipt.json
            ${{ env.EVIDENCE_ROOT }}/plan.json
            ${{ env.EVIDENCE_ROOT }}/run-result.json
            ${{ env.EVIDENCE_ROOT }}/verification.json
            ${{ env.EVIDENCE_ROOT }}/summary.json
            ${{ env.EVIDENCE_ROOT }}/passive-claude.json
            ${{ env.EVIDENCE_ROOT }}/passive-openai.json
            ${{ env.EVIDENCE_ROOT }}/receipts.jsonl
            ${{ env.EVIDENCE_ROOT }}/test-frontier-suite.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Render ledger and bind publication index
        shell: bash
        run: |
          set -euo pipefail
          python scripts/frontier_qualification.py render \
            --receipt "$EVIDENCE_ROOT/qualification-receipt.json" \
            --artifact-id "${{ steps.evidence.outputs.artifact-id }}" \
            --artifact-url "${{ steps.evidence.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.evidence.outputs.artifact-digest }}" \
            --out "$EVIDENCE_ROOT/qualification-comment.md"
          python scripts/frontier_qualification.py index \
            --receipt "$EVIDENCE_ROOT/qualification-receipt.json" \
            --artifact-id "${{ steps.evidence.outputs.artifact-id }}" \
            --artifact-url "${{ steps.evidence.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.evidence.outputs.artifact-digest }}" \
            --out "$EVIDENCE_ROOT/qualification-index.json"
          python scripts/frontier_qualification.py verify \
            --input "$EVIDENCE_ROOT/qualification-index.json" \
            --schema tier-bench/frontier-fingerprint-qualification-index@1

      - name: Upload publication index
        id: publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-fingerprint-publication-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/qualification-index.json
            ${{ env.EVIDENCE_ROOT }}/qualification-comment.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Seal runner-derived ledger
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.evidence.outputs.artifact-id }}"
          test -n "${{ steps.evidence.outputs.artifact-digest }}"
          test -n "${{ steps.publication.outputs.artifact-id }}"
          test -n "${{ steps.publication.outputs.artifact-digest }}"
          cat "$EVIDENCE_ROOT/qualification-index.json"
          cat "$EVIDENCE_ROOT/qualification-comment.md"
          cat "$EVIDENCE_ROOT/qualification-comment.md" >> "$GITHUB_STEP_SUMMARY"
