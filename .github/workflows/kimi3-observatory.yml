name: kimi3-observatory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile observatory modules
        run: |
          python -m py_compile \
            tier_runner/kimi3_common.py \
            tier_runner/kimi3_weights.py \
            tier_runner/kimi3_community.py \
            tier_runner/kimi3_probe.py \
            tier_runner/kimi3_observatory.py \
            tests/test_kimi3_observatory.py
      - name: Run zero-model-call observatory tests
        run: python -m unittest tests.test_kimi3_observatory -v
      - name: Validate example contracts
        run: |
          python -m tier_runner.kimi3_observatory validate \
            --config experiments/kimi3_observatory/observatory.example.json
          python -m tier_runner.kimi3_observatory community-validate \
            --config experiments/kimi3_observatory/observatory.example.json
