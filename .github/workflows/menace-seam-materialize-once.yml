name: menace-seam-materialize-once

on:
  push:
    branches: [agent/menace-edge-qualification-v1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/menace-edge-qualification-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and verify canonical seam products
        run: |
          python -m tier_runner.menace_seams plan \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --out experiments/menace_edge/minimal_witness_plan.json
          python -m tier_runner.menace_seams verify \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --plan experiments/menace_edge/minimal_witness_plan.json
          python -m tier_runner.menace_seams report \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --out-json experiments/menace_edge/seam_census_report.json \
            --out-markdown experiments/menace_edge/SEAM_CENSUS.md
          python -m tier_runner.menace_seams verify-report \
            --donors experiments/menace_edge/donor_piles.json \
            --seams experiments/menace_edge/seam_catalog.json \
            --coverage experiments/menace_edge/coverage_matrix.json \
            --report experiments/menace_edge/seam_census_report.json
          git diff --check

      - name: Commit exact generated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/menace_edge/minimal_witness_plan.json \
            experiments/menace_edge/seam_census_report.json \
            experiments/menace_edge/SEAM_CENSUS.md
          if git diff --cached --quiet; then
            echo "Canonical products already match."
            exit 0
          fi
          git commit -m "Materialize the MENACE seam census and minimal witness plan"
          git push origin HEAD:agent/menace-edge-qualification-v1
