\n[IO.File]::WriteAllText($env:ASTRA_PROBE_OUTPUT,($record | ConvertTo-Json -Depth 6)+"`n",[Text.UTF8Encoding]::new($false))\nif (-not $record.success -or $record.preference_after -ne $record.preference_before -or $record.new_temp_files.Count -ne 0) { exit 1 }\nWrite-Output $record.digest\n'

