name: astra-stage2-powershell51-canonical-payload-candidate-qualification
permissions:
  contents: read
concurrency:
  group: astra-ps51-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_BRANCH: candidate/astra-stage2-powershell51-canonical-payload-successor-20260904
  BINDER_HEAD: dbb44b7efca1b04f2ed2d8c127af653b278909e4
  BINDER_TREE: 2671247337030d9c8e281393103104f7436d2800
  LAW_HEAD: c36c35bf9b70d879e1e1c9ee2f0296879442df3e
  LAW_BLOB: 77abe4e177fc61e4f52f56ea64494b113f9662fc
  SUBJECT_COMMIT: 5c4d5b42b412232b4764cd5ebf1adc0c634e3126
  SUBJECT_TREE: b75fc13219c0cb9128358ecddfa95f1643e7e93e
  REPAIR_PARENT: e3367f9e5de48a099a585077a58ce9cff1051cab
  CARRIER_WORKFLOW: .github/workflows/astra-stage2-powershell51-canonical-payload-candidate-qualification.yml
jobs:
  subject-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Exact subject and carrier structure
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
        subject=os.environ['SUBJECT_COMMIT'];tree=os.environ['SUBJECT_TREE'];parent=os.environ['REPAIR_PARENT'];binder=os.environ['BINDER_HEAD'];carrier=os.environ['GITHUB_SHA'];workflow=os.environ['CARRIER_WORKFLOW']
        assert git('rev-parse','HEAD')==carrier
        assert git('show','-s','--format=%P',carrier)==subject
        assert git('diff','--name-only',subject,carrier).splitlines()==[workflow]
        assert git('rev-parse',subject+'^{tree}')==tree
        assert git('show','-s','--format=%P',subject)==parent
        expected={'scripts/Invoke-AstraStage2ControlIdentityBinding.ps1','tests/test_astra_stage2_control_identity_release.py','.github/workflows/astra-stage2-control-identity-release.yml','docs/agents/claims/FRR-ASTRA-STAGE2-WINDOWS-PREPARE-SUCCESSOR.md'}
        assert set(git('diff','--name-only',parent,subject).splitlines())==expected
        assert git('ls-remote','origin','refs/heads/'+os.environ['RELEASE_BRANCH']).split()[0]==subject
        subprocess.check_call(['git','merge-base','--is-ancestor',binder,subject])
        assert git('rev-parse',binder+'^{tree}')==os.environ['BINDER_TREE']
        assert git('rev-parse',subject+':docs/agents/claims/FRR-ASTRA-STAGE2-1.md')==os.environ['LAW_BLOB']
        assert git('rev-parse',subject+':astra_stage2/control_identity.py')==git('rev-parse',binder+':astra_stage2/control_identity.py')
        assert git('rev-parse',subject+':tests/test_astra_stage2_control_identity.py')==git('rev-parse',parent+':tests/test_astra_stage2_control_identity.py')
        assert git('rev-parse',subject+':scripts/Invoke-AstraStage2CheckpointRetry.ps1')==git('rev-parse',parent+':scripts/Invoke-AstraStage2CheckpointRetry.ps1')
        launcher=git('show',subject+':scripts/Invoke-AstraStage2ControlIdentityBinding.ps1')
        assert '& $Python -c $program $Path' not in launcher
        assert '[System.IO.FileMode]::CreateNew' in launcher
        assert '& $Python -B $createdScriptPath $Path' in launcher
        assert "'^[0-9a-f]{64}$'" in launcher
        assert "ErrorActionPreference = 'Continue'" in launcher and 'finally' in launcher
        receipt={'schema':'astra-ps51-repair-structure@1','subject_commit':subject,'subject_tree':tree,'parent':parent,'carrier_commit':carrier,'carrier_workflow':workflow,'changed_paths':sorted(expected),'binder':binder,'law_blob':os.environ['LAW_BLOB'],'source_guard':'PASS','physical_modes':[],'benchmark_model_calls':0,'provider_calls':0}
        payload=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode();receipt['payload_sha256']=hashlib.sha256(payload).hexdigest()
        pathlib.Path('guard-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
        print('EXACT_SOURCE_AND_CARRIER_GUARD_PASS',subject,tree)

        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ps51-subject-guard
        path: guard-receipt.json
        if-no-files-found: error
  windows-conformance:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      passed: ${{ steps.tests.outputs.passed }}
      skipped: ${{ steps.tests.outputs.skipped }}
      symlink_state: ${{ steps.tests.outputs.symlink_state }}
    steps:
    - name: Check out eventual exact release head and tree
      id: custody
      shell: pwsh
      env:
        EXPECTED_HEAD: 5c4d5b42b412232b4764cd5ebf1adc0c634e3126
      run: |
        $ErrorActionPreference = 'Stop'
        git init .
        if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
        git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
        if ($LASTEXITCODE -ne 0) { throw 'git remote add failed' }
        $refspec = "+refs/heads/{0}:refs/astra-release/candidate" -f $env:RELEASE_BRANCH
        git fetch --no-tags --depth=128 origin $refspec
        if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
        git checkout --detach refs/astra-release/candidate
        if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }

        $head = (git rev-parse HEAD).Trim()
        $tree = (git rev-parse 'HEAD^{tree}').Trim()
        if ($head -ne $env:EXPECTED_HEAD) {
          throw "Release head mismatch: expected $env:EXPECTED_HEAD, observed $head"
        }
        if ((git rev-parse "$($env:BINDER_HEAD)^{tree}").Trim() -ne $env:BINDER_TREE) {
          throw 'Qualified binder tree mismatch'
        }
        git merge-base --is-ancestor $env:BINDER_HEAD $head
        if ($LASTEXITCODE -ne 0) { throw 'Release does not descend from the qualified binder' }

        "head=$head" >> $env:GITHUB_OUTPUT
        "tree=$tree" >> $env:GITHUB_OUTPUT
    - name: Parse both PowerShell execution surfaces
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($relative in @(
          'scripts\Invoke-AstraStage2ControlIdentityBinding.ps1',
          'scripts\Invoke-AstraStage2CheckpointRetry.ps1'
        )) {
          $text = Get-Content -Raw -LiteralPath (Join-Path $PWD $relative)
          [void][scriptblock]::Create($text)
          Write-Host "POWERSHELL_PARSE_PASS $relative"
        }
    - name: Probe symlink privilege and run all 44 tests
      id: tests
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $evidenceRoot = Join-Path $env:RUNNER_TEMP 'astra-control-identity-windows-evidence'
        New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
        $env:ASTRA_TRANSPORT_EVIDENCE_DIR = $evidenceRoot
        $env:PYTHONDONTWRITEBYTECODE = '1'
        $env:PYTHONPATH = $PWD.ProviderPath
        $probeRoot = Join-Path $env:RUNNER_TEMP 'astra-symlink-privilege-probe'
        New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
        $target = Join-Path $probeRoot 'target.txt'
        $link = Join-Path $probeRoot 'link.txt'
        [System.IO.File]::WriteAllText($target, 'probe')
        $probeProgram = @'
        import os
        import pathlib
        import sys
        try:
            os.symlink(pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]))
        except OSError as exc:
            print(exc.winerror if exc.winerror is not None else -1)
            raise SystemExit(1)
        print("CAPABLE")
        '@
        $probeOutput = @(& python -c $probeProgram $target $link 2>&1)
        $probeExit = $LASTEXITCODE
        if ($probeExit -eq 0 -and ($probeOutput -join "`n") -match 'CAPABLE') {
          $symlinkState = 'CAPABLE'
        }
        elseif ($probeExit -ne 0 -and ($probeOutput -join "`n").Trim() -eq '1314') {
          $symlinkState = 'WINERROR_1314'
        }
        else {
          throw "Symlink probe failed for a reason other than WinError 1314: $($probeOutput -join ' | ')"
        }

        $lines = @(
          & python -B -m unittest discover `
            -s tests `
            -p 'test_astra_stage2_control_identity*.py' `
            -v 2>&1
        )
        $exitCode = $LASTEXITCODE
        $log = Join-Path $evidenceRoot 'test-control-identity-windows.log'
        $lines | Set-Content -Encoding utf8 -LiteralPath $log
        $lines | ForEach-Object { Write-Host $_ }
        if ($exitCode -ne 0) { throw "Windows suite failed with exit code $exitCode" }

        $joined = $lines -join "`n"
        if ($joined -notmatch '(?m)^Ran 44 tests in ') {
          throw 'Windows test denominator is not 44'
        }
        $testLines = @($lines | Where-Object { $_ -match '^test_' })
        $passedLines = @($testLines | Where-Object { $_ -match '\.\.\. ok$' })
        $skippedLines = @($testLines | Where-Object { $_ -match '\.\.\. skipped ' })
        $test10Lines = @($testLines | Where-Object { $_ -match '^test_10_symlinked_model_file_refuses ' })
        $test30Lines = @($testLines | Where-Object { $_ -match '^test_30_canonical_payload_digest_survives_native_powershell_argument_transport ' })
        if ($testLines.Count -ne 44 -or $test10Lines.Count -ne 1 -or
            $test30Lines.Count -ne 1 -or $test30Lines[0] -notmatch '\.\.\. ok$') {
          throw 'Windows verbose test ledger is incomplete or duplicated'
        }

        if ($symlinkState -eq 'CAPABLE') {
          if ($passedLines.Count -ne 44 -or $skippedLines.Count -ne 0 -or
              $test10Lines[0] -notmatch '\.\.\. ok$' -or
              $joined -notmatch '(?m)^OK$') {
            throw 'Symlink-capable Windows runner did not pass 44/44 with test_10 executed'
          }
        }
        else {
          if ($passedLines.Count -ne 43 -or $skippedLines.Count -ne 1 -or
              $skippedLines[0] -notmatch '^test_10_symlinked_model_file_refuses ' -or
              $joined -notmatch '(?m)^OK \(skipped=1\)$') {
            throw 'WinError-1314 runner did not produce the sole permitted test_10 skip'
          }
        }

        $transportPath = Join-Path $evidenceRoot 'transport-windows.json'
        $transport = Get-Content -Raw -LiteralPath $transportPath | ConvertFrom-Json
        $ps51 = @($transport.interpreters | Where-Object { $_.mode -eq 'windows_powershell_5_1' })
        $pwsh = @($transport.interpreters | Where-Object { $_.mode -eq 'windows_pwsh' })
        if ($ps51.Count -ne 1 -or $ps51[0].full_version -notmatch '^5\.1\.' -or
            $ps51[0].edition -ne 'Desktop' -or
            $ps51[0].ps_native_command_argument_passing -ne 'LEGACY_UNAVAILABLE' -or
            $ps51[0].fixtures.valid.outcome -ne 'PASS' -or
            $ps51[0].fixtures.valid.exit_code -ne 0 -or
            $ps51[0].fixtures.malformed.outcome -ne 'REFUSED' -or
            $ps51[0].fixtures.malformed.exit_code -ne 20 -or
            $pwsh.Count -ne 1 -or $pwsh[0].fixtures.valid.outcome -ne 'PASS' -or
            $pwsh[0].fixtures.valid.exit_code -ne 0 -or
            $pwsh[0].fixtures.malformed.outcome -ne 'REFUSED' -or
            $pwsh[0].fixtures.malformed.exit_code -ne 20 -or
            [string]::IsNullOrWhiteSpace($pwsh[0].edition) -or
            [string]::IsNullOrWhiteSpace($pwsh[0].ps_native_command_argument_passing) -or
            $transport.legacy_e336_windows_powershell_5_1.outcome -ne 'REPRODUCED_FAILURE' -or
            $transport.legacy_e336_windows_powershell_5_1.exit_code -ne 20 -or
            -not $transport.error_action_preference_restored -or
            $transport.temporary_script_cleanup -ne 'PASS' -or
            $transport.cleanup_error -ne 'REFUSED') {
          throw 'Windows transport fixture evidence is incomplete'
        }

        "log=$log" >> $env:GITHUB_OUTPUT
        "evidence_root=$evidenceRoot" >> $env:GITHUB_OUTPUT
        "transport_path=$transportPath" >> $env:GITHUB_OUTPUT
        "powershell_5_1_path=$($ps51[0].path)" >> $env:GITHUB_OUTPUT
        "powershell_5_1_version=$($ps51[0].full_version)" >> $env:GITHUB_OUTPUT
        "powershell_5_1_edition=$($ps51[0].edition)" >> $env:GITHUB_OUTPUT
        "powershell_5_1_argument_passing=$($ps51[0].ps_native_command_argument_passing)" >> $env:GITHUB_OUTPUT
        "pwsh_path=$($pwsh[0].path)" >> $env:GITHUB_OUTPUT
        "pwsh_version=$($pwsh[0].full_version)" >> $env:GITHUB_OUTPUT
        "pwsh_edition=$($pwsh[0].edition)" >> $env:GITHUB_OUTPUT
        "pwsh_argument_passing=$($pwsh[0].ps_native_command_argument_passing)" >> $env:GITHUB_OUTPUT
        "passed=$($passedLines.Count)" >> $env:GITHUB_OUTPUT
        "skipped=$($skippedLines.Count)" >> $env:GITHUB_OUTPUT
        "symlink_state=$symlinkState" >> $env:GITHUB_OUTPUT
    - name: Kill platform-applicable mutations and restore source bytes
      shell: bash
      run: |
        set -euo pipefail
        python - --repo . --out "$RUNNER_TEMP/ps51-mutations" <<'PY'
        import argparse, hashlib, json, os, pathlib, re, subprocess, sys
        p=argparse.ArgumentParser();p.add_argument('--repo',required=True);p.add_argument('--out',required=True);a=p.parse_args()
        root=pathlib.Path(a.repo).resolve();out=pathlib.Path(a.out).resolve();out.mkdir(parents=True,exist_ok=True)
        env={**os.environ,'PYTHONDONTWRITEBYTECODE':'1','PYTHONPATH':str(root),'PYTHONUTF8':'1'}
        env.pop('ASTRA_TRANSPORT_EVIDENCE_DIR',None)
        core=root/'astra_stage2/control_identity.py';launcher=root/'scripts/Invoke-AstraStage2ControlIdentityBinding.ps1'
        originals={core:core.read_bytes(),launcher:launcher.read_bytes()};records=[]
        PROBE_SOURCE='Set-StrictMode -Version Latest\n$ErrorActionPreference = \'Stop\'\n$ProgressPreference = \'SilentlyContinue\'\n$Python = $env:ASTRA_PROBE_PYTHON\n$tokens=$null; $parseErrors=$null\n$ast=[System.Management.Automation.Language.Parser]::ParseFile($env:ASTRA_PROBE_LAUNCHER,[ref]$tokens,[ref]$parseErrors)\nif ($parseErrors.Count -ne 0) { throw \'Launcher parse failed\' }\n$functions=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq \'Get-CanonicalPayloadSha256\'},$true))\nif ($functions.Count -ne 1) { throw \'Expected one exact function definition\' }\n$functionText=$functions[0].Extent.Text\n. ([scriptblock]::Create($functionText))\n$bytes=[System.Text.Encoding]::UTF8.GetBytes($functionText)\n$hasher=[System.Security.Cryptography.SHA256]::Create()\ntry { $functionDigest=([System.BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace(\'-\',\'\').ToLowerInvariant() } finally { $hasher.Dispose() }\n$before=@(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Filter \'astra-canonical-payload-*.py\' -File | ForEach-Object { $_.FullName })\n$record=[ordered]@{shell_version=$PSVersionTable.PSVersion.ToString();shell_edition=$PSVersionTable.PSEdition;function_sha256=$functionDigest;success=$false;digest=$null;error=$null;preference_before=[string]$ErrorActionPreference;preference_after=$null;new_temp_files=@()}\ntry {\n    $result=@(Get-CanonicalPayloadSha256 -Path $env:ASTRA_PROBE_TARGET)\n    if ($result.Count -ne 1 -or $result[0] -cnotmatch \'^[0-9a-f]{64}$\') { throw \'Probe result shape invalid\' }\n    $record.digest=[string]$result[0]\n    $record.success=$true\n} catch { $record.error=$_.Exception.Message }\n$record.preference_after=[string]$ErrorActionPreference\n$record.new_temp_files=@(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Filter \'astra-canonical-payload-*.py\' -File | Where-Object { $before -notcontains $_.FullName } | ForEach-Object { $_.Name })\n[IO.File]::WriteAllText($env:ASTRA_PROBE_OUTPUT,($record | ConvertTo-Json -Depth 6)+"`n",[Text.UTF8Encoding]::new($false))\nif (-not $record.success -or $record.preference_after -ne $record.preference_before -or $record.new_temp_files.Count -ne 0) { exit 1 }\nWrite-Output $record.digest\n'

        def transport_probe(label):
         harness=out/'dynamic-transport.ps1'
         harness.write_text(PROBE_SOURCE,encoding='utf-8',newline='\n')
         fixture=out/'mutation fixture with spaces.json'
         fixture.write_text(json.dumps({'z':[3,2,1],'a':'caf\u00e9','payload_sha256':'excluded'},ensure_ascii=False),encoding='utf-8')
         receipt=out/(label+'.json')
         probe_env={**env,'ASTRA_PROBE_PYTHON':sys.executable,'ASTRA_PROBE_LAUNCHER':str(launcher),'ASTRA_PROBE_TARGET':str(fixture),'ASTRA_PROBE_OUTPUT':str(receipt)}
         shell=pathlib.Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe'
         process=subprocess.run([str(shell),'-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',str(harness)],env=probe_env,capture_output=True,timeout=60)
         (out/(label+'.stdout.log')).write_bytes(process.stdout);(out/(label+'.stderr.log')).write_bytes(process.stderr)
         value=json.loads(receipt.read_text(encoding='utf-8'))
         assert value['shell_version'].startswith('5.1.') and value['preference_before']==value['preference_after'] and value['new_temp_files']==[]
         expected=hashlib.sha256(json.dumps({'z':[3,2,1],'a':'caf\u00e9'},sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')).hexdigest()
         return process.returncode,value,expected

        cases=[
         ('platform_substitution',core,'test_astra_stage2_control_identity.py','test_26_platform_substitution_refuses',b'    if record.get("platform") != system:',b'    if False:'),
         ('selected_index',core,'test_astra_stage2_control_identity.py','test_27_selected_index_mismatch_refuses',b'    if set(by_index) != set(indices) or len(query_rows) != len(indices):',b'    if False:'),
         ('device_query_digest',core,'test_astra_stage2_control_identity.py','test_28_device_query_digest_drift_refuses',b'    if record.get("device_query_sha256") != query_entry["sha256"]:',b'    if False:'),
         ('topology_payload',core,'test_astra_stage2_control_identity.py','test_29_topology_record_tamper_refuses',b'    if observed != expected:\n        raise Stage2Error(f"{label} payload hash mismatch")',b'    if False:\n        raise Stage2Error(f"{label} payload hash mismatch")'),
        ]
        if os.name=='nt':
         cases.append(('ps51_native_source_transport',launcher,'test_astra_stage2_control_identity_release.py','test_30_canonical_payload_digest_survives_native_powershell_argument_transport',b'& $Python -B $createdScriptPath $Path',b'& $Python -c $program $Path'))
        try:
         for name,path,pattern,witness,anchor,replacement in cases:
          original=originals[path]
          if original.count(anchor)!=1 and b'\n' in anchor:
           anchor=anchor.replace(b'\n',b'\r\n');replacement=replacement.replace(b'\n',b'\r\n')
          if original.count(anchor)!=1:raise RuntimeError(f'{name}: anchor count {original.count(anchor)}, expected one')
          changed=original.replace(anchor,replacement,1)
          assert changed!=original
          command=[sys.executable,'-B','-m','unittest','discover','-s','tests','-p',pattern,'-k',witness,'-v']
          baseline=subprocess.run(command,cwd=root,env=env,stdin=subprocess.DEVNULL,capture_output=True,timeout=180)
          (out/(name+'.baseline.stdout.log')).write_bytes(baseline.stdout)
          (out/(name+'.baseline.stderr.log')).write_bytes(baseline.stderr)
          if baseline.returncode!=0:raise RuntimeError(name+': pristine focused witness failed')
          dynamic=None
          if name=="ps51_native_source_transport":
           code,observed,expected=transport_probe("transport-baseline")
           assert code==0 and observed["success"] is True and observed["digest"]==expected
          path.write_bytes(changed)
          try:
           result=subprocess.run(command,cwd=root,env=env,capture_output=True,timeout=180)
           if name=="ps51_native_source_transport":
            code,observed,expected=transport_probe("transport-mutant")
            assert code!=0 and observed["success"] is False and "Canonical payload hashing failed" in observed["error"]
            dynamic={"baseline_passed":True,"mutant_refused":True,"shell_version":observed["shell_version"]}
          finally:path.write_bytes(original)
          (out/(name+'.stdout.log')).write_bytes(result.stdout);(out/(name+'.stderr.log')).write_bytes(result.stderr)
          text=(result.stdout+result.stderr).decode('utf-8',errors='replace')
          expected_exception_kill=(name=='selected_index' and 'KeyError: 0' in text and 'FAILED (errors=1)' in text)
          killed=result.returncode!=0 and re.search(r'Ran 1 test\b',text) is not None and ('FAILED (failures=' in text or expected_exception_kill)
          row={'name':name,'witness':witness,'applicable':True,'exit':result.returncode,'killed':killed,'original_sha256':hashlib.sha256(original).hexdigest(),'mutant_sha256':hashlib.sha256(changed).hexdigest(),'restored':path.read_bytes()==original,'stdout_sha256':hashlib.sha256(result.stdout).hexdigest(),'stderr_sha256':hashlib.sha256(result.stderr).hexdigest()}
          row['dynamic_transport']=dynamic;row['baseline_exit']=baseline.returncode;row['detection']='wrong exception rejected by Stage2Error witness' if expected_exception_kill else 'assertion failure'
          records.append(row);print(json.dumps(row),flush=True)
          if not killed:raise RuntimeError(name+': mutant survived or witness did not reach its assertion: '+text[-1500:])
        finally:
         for path,data in originals.items():
          if path.read_bytes()!=data:path.write_bytes(data)
         receipt={'platform':sys.platform,'witnesses':records,'killed':sum(r['killed'] for r in records),'required':len(cases),'restored':all(path.read_bytes()==data for path,data in originals.items()),'transport_mutant_scope':'Windows PowerShell 5.1 only','benchmark_model_calls':0,'launcher_modes':[]}
         (out/'MUTATIONS.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
        if receipt['killed']!=len(cases):raise SystemExit(1)
        print('ALL_APPLICABLE_MUTANTS_KILLED',len(cases))

        PY
        git diff --exit-code -- astra_stage2/control_identity.py scripts/Invoke-AstraStage2ControlIdentityBinding.ps1
    - name: Retain actual mutation evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ps51-mutations-windows
        path: ${{ runner.temp }}/ps51-mutations
        if-no-files-found: error
    - name: Seal Windows platform receipt
      id: receipt
      shell: pwsh
      env:
        SOURCE_HEAD: ${{ steps.custody.outputs.head }}
        SOURCE_TREE: ${{ steps.custody.outputs.tree }}
        TEST_LOG: ${{ steps.tests.outputs.log }}
        EVIDENCE_ROOT: ${{ steps.tests.outputs.evidence_root }}
        TRANSPORT_PATH: ${{ steps.tests.outputs.transport_path }}
        POWERSHELL_5_1_PATH: ${{ steps.tests.outputs.powershell_5_1_path }}
        POWERSHELL_5_1_VERSION: ${{ steps.tests.outputs.powershell_5_1_version }}
        POWERSHELL_5_1_EDITION: ${{ steps.tests.outputs.powershell_5_1_edition }}
        POWERSHELL_5_1_ARGUMENT_PASSING: ${{ steps.tests.outputs.powershell_5_1_argument_passing }}
        PWSH_PATH: ${{ steps.tests.outputs.pwsh_path }}
        PWSH_VERSION: ${{ steps.tests.outputs.pwsh_version }}
        PWSH_EDITION: ${{ steps.tests.outputs.pwsh_edition }}
        PWSH_ARGUMENT_PASSING: ${{ steps.tests.outputs.pwsh_argument_passing }}
        PASSED: ${{ steps.tests.outputs.passed }}
        SKIPPED: ${{ steps.tests.outputs.skipped }}
        SYMLINK_STATE: ${{ steps.tests.outputs.symlink_state }}
      run: |
        $ErrorActionPreference = 'Stop'
        $path = Join-Path $env:EVIDENCE_ROOT 'platform-receipt.json'
        $value = [ordered]@{
          schema = 'tier-bench/astra-stage2-control-identity-platform-qualification@1'
          platform = 'windows-2025'
          source_head_sha1 = $env:SOURCE_HEAD
