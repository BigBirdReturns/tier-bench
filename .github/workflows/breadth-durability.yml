name: breadth-durability
# The boring checks that keep the measurement layer from rotting.
# No provider keys, no live model calls, $0.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Orchestration receipts bind manifests to an exact historical source
          # commit. The validator must be able to read that Git object rather
          # than silently substituting the current checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compile breadth + harness tooling
        run: |
          python -m py_compile experiments/breadth/*.py experiments/breadth/selfrun/*.py \
            experiments/breadth/hooks/*.py \
            harness/*.py experiments/almanac/reference/*.py experiments/breadth/edge_family/*.py \
            scripts/validate_primitives.py tests/test_validate_primitives.py
      - name: valid task set prints (hidden-grader guard)
        run: python experiments/breadth/breadth_tasks.py
      - name: grade->ledger->map spine ($0)
        run: python experiments/breadth/smoke.py
      - name: tier run + pilot composition instruments (fixtures only; zero model calls)
        run: |
          python -m py_compile tier_runner/*.py tier_runner/adapters/*.py tests/test_tier_runner.py tests/test_tier_pilot_composition.py
          python tests/test_tier_runner.py
          python tests/test_tier_pilot_composition.py
      - name: UI-capture lane end-to-end ($0, temp files)
        run: python experiments/breadth/ui_capture_smoke.py
      - name: waterline schema + evidence-layer enforcement
        run: python experiments/breadth/waterline.py --check
      - name: AXM primitives are sourced (unsourced primitive fails the build)
        run: python scripts/validate_primitives.py
      - name: provenance guard tests bite
        run: python tests/test_validate_primitives.py
      - name: scaffold packet emits from sediment ($0, both formats + unmeasured path)
        run: |
          python -m py_compile scripts/emit_scaffold.py
          python scripts/emit_scaffold.py > /dev/null
          python scripts/emit_scaffold.py --format json | python -c "import json,sys; p=json.load(sys.stdin); assert p['residue_commitments'] and p['routing_floor'] and p['evidence_layers']"
          python scripts/emit_scaffold.py --task no_such_task --format json | python -c "import json,sys; assert json.load(sys.stdin)['status']=='UNMEASURED'"
      - name: capture ledger validates (closure discipline; no amortization without replays)
        run: |
          python -m py_compile scripts/validate_capture_ledger.py scripts/capture_roi.py
          python scripts/validate_capture_ledger.py
          python scripts/capture_roi.py --json | python -c "import json,sys; r={x['capture_id']:x for x in json.load(sys.stdin)}['task02_escape_class_boundary']; assert r['projected_break_even_replays']==4 and r['roi_state']=='amortizing' and r['validated_replays']==2 and r['replays_remaining_to_break_even']==2"
      - name: almanac corpus — vectors match the reference; graders bite; no leaks
        run: |
          python -m py_compile experiments/almanac/generate_vectors.py tests/test_almanac_vectors.py
          python experiments/almanac/generate_vectors.py --check
          python tests/test_almanac_vectors.py
      - name: authoring batch 3 — frozen graders match the reference derivation
        run: |
          python -m py_compile experiments/breadth/authoring3/build_vectors.py \
            fixtures/t3_null_filter_001/hidden_tests.py \
            fixtures/t3_accrual_crossover_001/hidden_tests.py \
            tests/test_authoring3_graders.py
          python experiments/breadth/authoring3/build_vectors.py --check
          python tests/test_authoring3_graders.py
      - name: authoring batch 2 — frozen graders match the reference derivation
        run: |
          python -m py_compile experiments/breadth/authoring2/build_vectors.py \
            fixtures/t3_billing_anchor_001/hidden_tests.py \
            fixtures/t3_window_limit_001/hidden_tests.py \
            fixtures/t3_due_date_shift_001/hidden_tests.py \
            tests/test_authoring2_graders.py
          python experiments/breadth/authoring2/build_vectors.py --check
          python tests/test_authoring2_graders.py
      - name: capture guard tests bite
        run: |
          python tests/test_capture_ledger.py
          python tests/test_capture_roi.py
      - name: quota gauge — infers allotment from limit-hit intervals; refuses to size against a guess
        run: |
          python -m py_compile tests/test_quota.py
          python tests/test_quota.py
          python -m py_compile experiments/breadth/hooks/session_burn_hook.py tests/test_session_burn_hook.py
          python tests/test_session_burn_hook.py
      - name: OSS replay field — licenses, vendored bytes, hidden grading, distinct-instance rule; vectors match vendored upstream
        run: |
          python -m py_compile scripts/validate_oss_replay_field.py experiments/oss_replay/generate_vectors.py tests/test_oss_replay_field.py
          python scripts/validate_oss_replay_field.py
          python experiments/oss_replay/generate_vectors.py --check
          python tests/test_oss_replay_field.py
      - name: ARC-C residue broker contract (floor-first; no self-grading)
        run: |
          python -m py_compile experiments/breadth/residue_broker.py scripts/validate_orchestration_run.py scripts/export_solver_packet.py scripts/extract_codex_rollout_response.py scripts/grade_solver_packet.py scripts/ingest_engine_trial.py scripts/compare_engine_runs.py tests/test_residue_broker.py tests/test_export_solver_packet.py tests/test_extract_codex_rollout_response.py tests/test_grade_solver_packet.py tests/test_compare_engine_runs.py tests/test_orchestration_clone_integrity.py
          python scripts/validate_orchestration_run.py
          python tests/test_residue_broker.py
          python tests/test_export_solver_packet.py
          python tests/test_extract_codex_rollout_response.py
          python tests/test_grade_solver_packet.py
          python tests/test_compare_engine_runs.py
          python tests/test_orchestration_clone_integrity.py
      - name: ARC-D B2 charter (ratified bytes, sealed inputs, no response disclosure)
        run: |
          python -m py_compile scripts/validate_arc_d_harvest_charter.py tests/test_arc_d_harvest_charter.py
          python scripts/validate_arc_d_harvest_charter.py
          python tests/test_arc_d_harvest_charter.py
      - name: ARC-D B2 packet exporter (one response, canonical blobs, fail closed)
        run: |
          python -m py_compile scripts/export_arc_d_b2_packets.py scripts/validate_arc_d_b2_packet.py tests/test_arc_d_b2_packets.py
          python tests/test_arc_d_b2_packets.py
      - name: ARC-D B2 admission v2 specification (unchanged rubric; operations disabled)
        run: |
          python -m py_compile scripts/validate_arc_d_b2_admission_v2.py tests/test_arc_d_b2_admission_v2.py
          python scripts/validate_arc_d_b2_admission_v2.py
          python tests/test_arc_d_b2_admission_v2.py
