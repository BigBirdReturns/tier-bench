name: world-experience-atlas

on:
  pull_request:
  workflow_dispatch:

jobs:
  zero-model-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile tier_runner/experience_atlas.py tests/test_experience_atlas.py
      - name: Exercise atlas law
        run: python tests/test_experience_atlas.py
      - name: Validate and plan
        run: |
          python -m tier_runner.experience_atlas validate \
            --atlas experiments/world_experience/atlas.json
          python -m tier_runner.experience_atlas plan \
            --atlas experiments/world_experience/atlas.json \
            --limit 12 \
            --out /tmp/world-experience-plan.json
          python -m tier_runner.experience_atlas verify \
            --atlas experiments/world_experience/atlas.json \
            --plan /tmp/world-experience-plan.json
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/world-experience-plan.json', encoding='utf-8'))
          assert plan['totals']['patterns'] >= 12
          assert plan['totals']['disciplines'] >= 5
          ids = {
              row['id']
              for wave in plan['waves']
              for row in wave['patterns']
          }
          assert 'B01-action-cache-cas' in ids
          assert 'W01-event-history-replay' in ids
          assert 'C01-typed-work-ir' in ids
          assert 'U01-attention-broker' in ids
          print('WORLD_EXPERIENCE_PLAN_OK', plan['totals'])
          PY
