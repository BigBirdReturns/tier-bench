name: Deploy Tier Bench site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'models.json'
      - 'scripts/generate_cheatsheet.py'
      - 'site/**'
      - 'data/results/**'
      - 'data/control-results/**'
      - 'scripts/aggregate.py'
      - 'scripts/aggregate_control.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build site
        run: |
          mkdir -p _site
          # Ship every static asset in site/ (index, ab, control, uplift, tally,
          # the SCG mark script, tally.json) — not a hardcoded subset, so new
          # pages can't silently 404 on the live site.
          cp site/*.html _site/
          cp site/*.js _site/ 2>/dev/null || true
          cp site/*.json _site/ 2>/dev/null || true
          python scripts/generate_cheatsheet.py --out _site/cheatsheet.html
          python scripts/aggregate.py --data data/results --emit-rows _site/community_results.jsonl --json > _site/aggregate.json
          python scripts/contribute.py --emit-meta _site/contrib_meta.json
          python scripts/aggregate_control.py --data data/control-results --json > _site/control_aggregate.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
