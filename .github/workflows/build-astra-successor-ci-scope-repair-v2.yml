name: build-astra-successor-ci-scope-repair-v2

on:
  push:
    branches:
      - repair/astra-stage2-successor-ci-scope-builder-20260903

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Build exact successor commit from current release head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_HEAD: 125fdc367920960421d1e080900f1806637277f4
          BASE_TREE: ccab08e1192346f9c386b0f41ffaab77bac73194
          PREDECESSOR_WORKFLOW_BLOB: 70af029d2c4574038e02d4cdf1e05d59a56bde6f
          RELEASE_WORKFLOW_BLOB: aa3515ea2e1994f0ccd6f71e8ec6cc55e09b3f0a
          OUTPUT_BRANCH: repair/astra-stage2-successor-ci-scope-ready-20260903
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=64 origin \
            "+${BASE_HEAD}:refs/successor-ci-scope/base"
          git checkout --detach refs/successor-ci-scope/base

          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          test "$(git rev-parse 'HEAD:.github/workflows/astra-stage2-control-identity.yml')" = \
            "$PREDECESSOR_WORKFLOW_BLOB"
          test "$(git rev-parse 'HEAD:.github/workflows/astra-stage2-control-identity-release.yml')" = \
            "$RELEASE_WORKFLOW_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          predecessor_path = Path(
              ".github/workflows/astra-stage2-control-identity.yml"
          )
          predecessor = predecessor_path.read_text(encoding="utf-8")
          predecessor_anchor = "  pull_request:\n    paths:\n"
          predecessor_replacement = (
              "  pull_request:\n"
              "    branches:\n"
              "      - joint/astra-stage2-calibration-impl-20260902\n"
              "    paths:\n"
          )
          if predecessor.count(predecessor_anchor) != 1:
              raise SystemExit(
                  "predecessor pull_request anchor does not occur exactly once"
              )
          predecessor_path.write_text(
              predecessor.replace(
                  predecessor_anchor,
                  predecessor_replacement,
                  1,
              ),
              encoding="utf-8",
              newline="\n",
          )

          release_path = Path(
              ".github/workflows/astra-stage2-control-identity-release.yml"
          )
          release = release_path.read_text(encoding="utf-8")

          path_anchor = (
              '          expected = {\n'
              '              ".github/workflows/astra-stage2-control-identity-release.yml",\n'
          )
          path_replacement = (
              '          expected = {\n'
              '              ".github/workflows/astra-stage2-control-identity-release.yml",\n'
              '              ".github/workflows/astra-stage2-control-identity.yml",\n'
          )
          if release.count(path_anchor) != 1:
              raise SystemExit(
                  "release path-set anchor does not occur exactly once"
              )
          release = release.replace(path_anchor, path_replacement, 1)

          test_step_anchor = (
              "      - name: Run complete 27-test suite on Windows\n"
          )
          scope_step = r"""      - name: Verify predecessor workflow successor scope
                shell: pwsh
                run: |
                  $ErrorActionPreference = 'Stop'
                  $path = Join-Path $PWD '.github\workflows\astra-stage2-control-identity.yml'
                  $value = Get-Content -Raw -LiteralPath $path
                  $pullRequestPattern = '(?ms)^  pull_request:\r?\n    branches:\r?\n      - joint/astra-stage2-calibration-impl-20260902\r?\n    paths:'
                  if ($value -notmatch $pullRequestPattern) {
                    throw 'Predecessor binder workflow is not scoped to its original PR base'
                  }
                  $pushPattern = '(?ms)^  push:\r?\n    branches:\r?\n      - joint/astra-stage2-control-identities-20260903'
                  if ($value -notmatch $pushPattern) {
                    throw 'Predecessor binder workflow lost its exact candidate push lane'
                  }
                  Write-Host 'PREDECESSOR_WORKFLOW_SUCCESSOR_SCOPE_PASS'

              - name: Run complete 27-test suite on Windows
          """
          if release.count(test_step_anchor) != 1:
              raise SystemExit(
                  "Windows test-step anchor does not occur exactly once"
              )
          release = release.replace(test_step_anchor, scope_step, 1)

          receipt_anchor = (
              "            launcher_preflight = 'PASS'\n"
              "            preflight_downloads = 0\n"
          )
          receipt_replacement = (
              "            launcher_preflight = 'PASS'\n"
              "            predecessor_workflow_successor_scope = 'PASS'\n"
              "            preflight_downloads = 0\n"
          )
          if release.count(receipt_anchor) != 1:
              raise SystemExit(
                  "Windows receipt scope anchor does not occur exactly once"
              )
          release = release.replace(
              receipt_anchor,
              receipt_replacement,
              1,
          )

          copy_anchor = (
              "          cp scripts/Invoke-AstraStage2ControlIdentityBinding.ps1 \\\n"
              '            "$EVIDENCE_ROOT/Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
          )
          copy_replacement = (
              "          cp .github/workflows/astra-stage2-control-identity.yml \\\n"
              '            "$EVIDENCE_ROOT/predecessor-control-identity-workflow.yml"\n'
              "          cp scripts/Invoke-AstraStage2ControlIdentityBinding.ps1 \\\n"
              '            "$EVIDENCE_ROOT/Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
          )
          if release.count(copy_anchor) != 1:
              raise SystemExit(
                  "release evidence-copy anchor does not occur exactly once"
              )
          release = release.replace(copy_anchor, copy_replacement, 1)

          conformance_anchor = (
              '                  "repository_root_discovery_tested": True,\n'
              '                  "cross_platform_runtime_fixture": True,\n'
          )
          conformance_replacement = (
              '                  "repository_root_discovery_tested": True,\n'
              '                  "predecessor_workflow_successor_scope": True,\n'
              '                  "cross_platform_runtime_fixture": True,\n'
          )
          if release.count(conformance_anchor) != 1:
              raise SystemExit(
                  "qualification conformance anchor does not occur exactly once"
              )
          release = release.replace(
              conformance_anchor,
              conformance_replacement,
              1,
          )

          publication_anchor = (
              '              "pinned_launcher": (\n'
              '                  "Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
              "              ),\n"
              '              "actual_control_identities": "UNBOUND",\n'
          )
          publication_replacement = (
              '              "pinned_launcher": (\n'
              '                  "Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
              "              ),\n"
              '              "predecessor_workflow_successor_scope": True,\n'
              '              "actual_control_identities": "UNBOUND",\n'
          )
          if release.count(publication_anchor) != 1:
              raise SystemExit(
                  "publication scope anchor does not occur exactly once"
              )
          release = release.replace(
              publication_anchor,
              publication_replacement,
              1,
          )

          release_path.write_text(
              release,
              encoding="utf-8",
              newline="\n",
          )
          PY

          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          predecessor = Path(
              ".github/workflows/astra-stage2-control-identity.yml"
          ).read_text(encoding="utf-8")
          release = Path(
              ".github/workflows/astra-stage2-control-identity-release.yml"
          ).read_text(encoding="utf-8")

          required_predecessor = (
              "  pull_request:\n"
              "    branches:\n"
              "      - joint/astra-stage2-calibration-impl-20260902\n"
              "    paths:\n"
          )
          if required_predecessor not in predecessor:
              raise SystemExit(
                  "predecessor workflow scope repair is absent"
              )
          if "PREDECESSOR_WORKFLOW_SUCCESSOR_SCOPE_PASS" not in release:
              raise SystemExit(
                  "release workflow does not execute the scope gate"
              )
          if (
              '"predecessor_workflow_successor_scope": True'
              not in release
          ):
              raise SystemExit(
                  "release receipt does not retain the scope result"
              )
          if (
              "predecessor-control-identity-workflow.yml"
              not in release
          ):
              raise SystemExit(
                  "release evidence does not retain the predecessor workflow"
              )
          PY

          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add \
            .github/workflows/astra-stage2-control-identity.yml \
            .github/workflows/astra-stage2-control-identity-release.yml
          git commit -m "ci(astra): scope predecessor binder gate to its candidate lane"

          successor_head="$(git rev-parse HEAD)"
          successor_tree="$(git rev-parse 'HEAD^{tree}')"
          predecessor_blob="$(git rev-parse 'HEAD:.github/workflows/astra-stage2-control-identity.yml')"
          release_blob="$(git rev-parse 'HEAD:.github/workflows/astra-stage2-control-identity-release.yml')"

          git push --force origin "HEAD:refs/heads/${OUTPUT_BRANCH}"

          {
            echo "successor_head=${successor_head}"
            echo "successor_tree=${successor_tree}"
            echo "predecessor_workflow_blob=${predecessor_blob}"
            echo "release_workflow_blob=${release_blob}"
            echo "output_branch=${OUTPUT_BRANCH}"
          } >> "$GITHUB_STEP_SUMMARY"
