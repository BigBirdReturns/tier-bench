name: One-shot Interaction Floor v0.3 publication carrier

on:
  push:
    branches: [agent/axm-estate-lab]
    paths: ['.floor-v03-trigger']

permissions:
  contents: write

concurrency:
  group: interaction-floor-v03-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/axm-estate-lab
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed Interaction Floor source
        shell: bash
        run: |
          set -euo pipefail
          cat .floor-v03-payload-* | base64 -d > "$RUNNER_TEMP/floor-v03.tar.xz"
          echo "401b8ce6127d93bc02e0a84f62c84b0cdc717413f1c7ba36caed0079997c6ab2  $RUNNER_TEMP/floor-v03.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/floor-v03.tar.xz"

      - name: Qualify the public floor
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q estate_lab
          python -m estate_lab validate
          python -m estate_lab commodities --format json > "$RUNNER_TEMP/commodities.json"
          python -m estate_lab floor validate
          python -m estate_lab floor describe --format json > "$RUNNER_TEMP/floor.json"
          python -m estate_lab floor gaps --format json > "$RUNNER_TEMP/gaps.json"
          python -m unittest discover -s estate_lab/tests -v
          rm -rf "$RUNNER_TEMP/floor-a" "$RUNNER_TEMP/floor-b" "$RUNNER_TEMP/estate-runs"
          python -m estate_lab floor test --adapter estate_lab/fixtures/floor/reference-adapter/adapter.json --output "$RUNNER_TEMP/floor-a" --json > "$RUNNER_TEMP/floor-a.json"
          python -m estate_lab floor test --adapter estate_lab/fixtures/floor/reference-adapter/adapter.json --output "$RUNNER_TEMP/floor-b" --json > "$RUNNER_TEMP/floor-b.json"
          cmp "$RUNNER_TEMP/floor-a.json" "$RUNNER_TEMP/floor-b.json"
          SUBMISSION="$(find "$RUNNER_TEMP/floor-a" -mindepth 1 -maxdepth 1 -type d | sort | head -1)"
          python -m estate_lab floor verify-submission "$SUBMISSION/submission.json"
          python -m estate_lab floor registry --submission "$SUBMISSION/submission.json" --format json --output "$RUNNER_TEMP/registry.json"
          python -m estate_lab floor verify-registry "$RUNNER_TEMP/registry.json"
          python -m estate_lab run-all --output "$RUNNER_TEMP/estate-runs"
          git diff --check

      - name: Publish permanent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A estate_lab
          git commit -m 'Establish the public AXM Interaction Floor'
          git push origin HEAD:agent/axm-estate-lab
