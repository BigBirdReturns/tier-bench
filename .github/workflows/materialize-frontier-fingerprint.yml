name: materialize-frontier-fingerprint

on:
  push:
    branches:
      - codex/frontier-fingerprint-20260901
    paths:
      - ".frontier-materialize/**"
      - ".github/workflows/materialize-frontier-fingerprint.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/frontier-fingerprint-20260901

      - name: Authenticate and extract exact payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          expected = "05cba765685ebc1a16ea30842f47d4648e548d195fb72ef72891138ecd04c818"
          encoded = "".join(
              "".join(path.read_text(encoding="ascii").split())
              for path in sorted(Path(".frontier-materialize").glob("payload.*"))
          )
          payload = base64.b64decode(encoded, validate=True)
          observed = hashlib.sha256(payload).hexdigest()
          if observed != expected:
              raise SystemExit(f"payload digest mismatch: {observed} != {expected}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  if member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported payload member: {member.name}")
              archive.extractall(".")
          PY

      - name: Run exact provider-free qualification before custody commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frontier_fingerprint/*.py \
            scripts/frontier_fingerprint.py \
            tests/test_frontier_fingerprint.py
          python tests/test_frontier_fingerprint.py

          root="$(mktemp -d)"
          run_dir="$root/run"
          python scripts/frontier_fingerprint.py plan \
            --manifest experiments/frontier_fingerprint/mock-smoke.json \
            --out "$root/plan.json"
          python scripts/frontier_fingerprint.py run \
            --manifest experiments/frontier_fingerprint/mock-smoke.json \
            --out "$run_dir"
          python scripts/frontier_fingerprint.py verify \
            --run-dir "$run_dir" \
            --out "$root/verification.json"
          python scripts/frontier_fingerprint.py summarize \
            --run-dir "$run_dir" \
            --out "$root/summary.json"

          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt_count"])' "$root/verification.json")" -eq 58
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["exact_requests_rebuilt"])' "$root/verification.json")" -eq 58
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["raw_response_bodies_authenticated"])' "$root/verification.json")" -eq 58

      - name: Commit materialized implementation without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .frontier-materialize
          rm -f .github/workflows/frontier-fingerprint.yml
          git config user.name "tier-bench-custody-bot"
          git config user.email "tier-bench-custody-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(frontier): materialize fingerprint observatory"
          git push origin HEAD:codex/frontier-fingerprint-20260901
