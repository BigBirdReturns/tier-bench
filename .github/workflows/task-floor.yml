name: task-floor

on:
  pull_request:
    branches:
      - main
      - agent/conditional-memory-lab-v1
      - agent/task-computer-v1
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependency-free Tier Bench package
        run: python -m pip install -e .
      - name: Compile Task Floor surfaces
        run: >-
          python -m py_compile
          tier_runner/task_floor_protocol.py
          tier_runner/task_floor_driver.py
          tier_runner/task_floor_export.py
          tier_runner/task_floor_conformance.py
          tier_runner/task_floor_replay.py
          tier_runner/task_floor_cli.py
          examples/task_floor/reference_driver.py
          tests/test_task_floor_protocol.py
          tests/test_task_floor_driver.py
          tests/test_task_floor_bundle.py
          tests/test_task_floor_registry.py
          tests/test_task_floor_integration.py
      - name: Run zero-browser Task Floor tests
        run: |
          python tests/test_task_floor_protocol.py
          python tests/test_task_floor_driver.py
          python tests/test_task_floor_bundle.py
          python tests/test_task_floor_registry.py
      - name: Validate public reference documents
        shell: bash
        run: |
          python -m tier_runner.task_floor_cli manifest-validate \
            --manifest experiments/task_floor/reference_manifest.json
          python -m tier_runner.task_floor_cli registry-validate \
            --registry experiments/task_floor/oss_registry.json
          python -m tier_runner.task_floor_cli action-validate \
            --action examples/task_floor/reference_action.json
          python -m tier_runner.task_floor_cli approval-validate \
            --approval examples/task_floor/reference_approval.json
          python -m tier_runner.task_floor_cli gap-report \
            --registry experiments/task_floor/oss_registry.json \
            --out generated-gap-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path("generated-gap-report.json").read_text())
          committed = json.loads(
              Path("experiments/task_floor/gap_report.json").read_text()
          )
          assert generated == committed
          assert generated["entries"] == 21
          assert generated["axes"] == 26
          print("TASK_FLOOR_GAP_REPORT_OK", generated["report_sha256"])
          PY
      - name: Run public driver TCK
        shell: bash
        run: |
          export TASK_FLOOR_DRIVER_ROOT="$RUNNER_TEMP/task-floor-driver"
          python -m tier_runner.task_floor_cli driver-test \
            --command "python examples/task_floor/reference_driver.py" \
            --cwd . \
            --out task-floor-driver-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("task-floor-driver-report.json").read_text())
          assert report["passed"] is True
          assert report["highest_contiguous_profile"] == "TF4"
          print("TASK_FLOOR_DRIVER_OK", report["report_sha256"])
          PY
      - name: Parse and run Windows operator launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/run-task-floor-conformance.ps1),
            [ref]$Tokens,
            [ref]$Errors
          )
          if ($Errors.Count -gt 0) {
            $Errors | Format-List | Out-String | Write-Error
            exit 1
          }
          .\scripts\run-task-floor-conformance.ps1 `
            -Command quick `
            -OutRoot "$env:RUNNER_TEMP\TaskFloor"
          Write-Host "TASK_FLOOR_POWERSHELL_OK"

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Task Computer and Playwright
        run: python -m pip install -e ".[browser]"
      - name: Install pinned Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run Task Floor browser integration
        run: python tests/test_task_floor_integration.py
      - name: Build a self-contained public bundle
        shell: bash
        run: |
          python -m tier_runner.task_floor_cli bundle-build \
            --run-dir tests/fixtures/task_floor/accepted-run \
            --manifest experiments/task_floor/reference_manifest.json \
            --out-dir task-floor-reference-bundle \
            --a2a-endpoint https://example.invalid/a2a
          python -m tier_runner.task_floor_cli bundle-verify \
            --bundle task-floor-reference-bundle/bundle.json \
            --artifact-root task-floor-reference-bundle
          python -m tier_runner.task_floor_cli bundle-assess \
            --bundle task-floor-reference-bundle/bundle.json \
            --out task-floor-reference-bundle/conformance.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("task-floor-reference-bundle/conformance.json").read_text()
          )
          assert report["highest_contiguous_profile"] == "TF5"
          assert report["claims"]["overclaimed_profiles"] == []
          assert Path(
              "task-floor-reference-bundle/artifacts/records/0001-step.json"
          ).is_file()
          print("TASK_FLOOR_BUNDLE_OK", report["report_sha256"])
          PY
      - name: Preserve conformance bundle
        uses: actions/upload-artifact@v4
        with:
          name: task-floor-reference-bundle
          path: task-floor-reference-bundle
          if-no-files-found: error
