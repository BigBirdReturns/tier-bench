name: astra-stage2-control-identity-bootstrap

on:
  push:
    branches:
      - bootstrap/astra-stage2-control-identities-20260903

permissions:
  contents: write

concurrency:
  group: astra-stage2-control-identity-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit-validated-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact staging and target coordinates
        id: custody
        shell: bash
        env:
          EXPECTED_STAGING_HEAD: ${{ github.sha }}
          STAGING_BRANCH: bootstrap/astra-stage2-control-identities-20260903
          TARGET_BRANCH: joint/astra-stage2-control-identities-20260903
          JOIN_HEAD: f6b24be2a2c411444f0d4005aed3bd61769733a5
          JOIN_TREE: ba2227e2d8ba132ac585e8ef201915a5b6a5de5b
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=128 origin \
            "+refs/heads/${STAGING_BRANCH}:refs/bootstrap/candidate" \
            "+refs/heads/${TARGET_BRANCH}:refs/bootstrap/target"
          git checkout --detach refs/bootstrap/candidate
          staging_head="$(git rev-parse HEAD)"
          target_head="$(git rev-parse refs/bootstrap/target)"
          test "$staging_head" = "$EXPECTED_STAGING_HEAD"
          test "$target_head" = "$JOIN_HEAD"
          test "$(git rev-parse "${JOIN_HEAD}^{tree}")" = "$JOIN_TREE"
          git merge-base --is-ancestor "$JOIN_HEAD" "$staging_head"
          printf 'staging_head=%s\n' "$staging_head" >> "$GITHUB_OUTPUT"

      - name: Verify and reconstruct exact payload
        id: payload
        shell: bash
        env:
          JOIN_HEAD: f6b24be2a2c411444f0d4005aed3bd61769733a5
        run: |
          set -euo pipefail
          payload_root="$RUNNER_TEMP/control-id-payload"
          extracted_root="$RUNNER_TEMP/control-id-extracted"
          mkdir -p "$payload_root" "$extracted_root"
          for index in 00 01 02 03 04 05 06
          do
            cp ".bootstrap/control-id-payload-part-${index}" \
              "$payload_root/part-${index}"
          done
          cat > "$payload_root/CHUNK_SHA256SUMS" <<'EOF'
          8c3bc5d752e35de6297650e7edefde409d50a416aa8ec6469c119a6468d50639  part-00
          5023fb800b24747149d5f9d01edb7ef32f1495d861ebd416d550b757e48342e7  part-01
          363c772de8ee42bc08ca0a14a46b1e64f051a42ea1837454c19cac9d90ed3589  part-02
          97aee7623069c35ee97b0d8d26823e5217294a2390447f7e8e2c0d183f9356d2  part-03
          162671c28a02b83042d4d02edfe221ad3e340aa52346fa910aae1d011edc2f85  part-04
          fef337ce1f3dd5bb7138b6a2ff8de2fd47ef510a65ddc7243926272b9394fc55  part-05
          dd63288f992079a9f305b8561674ff8d97baefdd7e920ee630451a1e4bc9d2a5  part-06
          EOF
          (
            cd "$payload_root"
            sha256sum -c CHUNK_SHA256SUMS
            cat part-00 part-01 part-02 part-03 part-04 part-05 part-06 > payload.b64
            echo "548d7a7c5dca3af7444af5708292c1998b94ef4fd61fbce084f8f85579a509de  payload.b64" | sha256sum -c -
            base64 --decode payload.b64 > payload.tar.xz
            echo "163700a7d7db9382ebd4661aedf45919ef0edf7a779246b9d86c32fef511f768  payload.tar.xz" | sha256sum -c -
          )
          python3 - "$payload_root/payload.tar.xz" "$extracted_root" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          expected = {
              ".github/workflows/astra-stage2-control-identity.yml",
              "astra_stage2/control_identity.py",
              "docs/agents/claims/FRR-ASTRA-STAGE2-CONTROL-IDENTITY-1.md",
              "experiments/astra_kxr/stage2/control_identity/README.md",
              "experiments/astra_kxr/stage2/control_identity/binding-template.json",
              "schemas/astra-stage2-control-binding-input.schema.json",
              "schemas/astra-stage2-executable-control-private.schema.json",
              "schemas/astra-stage2-executable-control-public.schema.json",
              "schemas/astra-stage2-executable-control-set.schema.json",
              "scripts/astra_stage2_bind_controls.ps1",
              "scripts/astra_stage2_bind_controls.py",
              "tests/test_astra_stage2_control_identity.py",
          }
          with tarfile.open(archive_path, "r:xz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(
                      f"payload path set mismatch: expected={sorted(expected)}, "
                      f"observed={sorted(names)}"
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe payload member: {member.name}")
              archive.extractall(destination, filter="data")
          PY
          git checkout --detach "$JOIN_HEAD"
          while IFS= read -r -d '' source
          do
            relative="${source#${extracted_root}/}"
            install -D -m 0644 "$source" "$relative"
          done < <(find "$extracted_root" -type f -print0 | sort -z)
          printf 'extracted_root=%s\n' "$extracted_root" >> "$GITHUB_OUTPUT"

      - name: Validate exact source transaction
        shell: bash
        env:
          JOIN_HEAD: f6b24be2a2c411444f0d4005aed3bd61769733a5
        run: |
          set -euo pipefail
          git diff --check "$JOIN_HEAD" --
          python3 -m py_compile \
            astra_stage2/control_identity.py \
            scripts/astra_stage2_bind_controls.py \
            tests/test_astra_stage2_control_identity.py
          for schema in \
            schemas/astra-stage2-control-binding-input.schema.json \
            schemas/astra-stage2-executable-control-private.schema.json \
            schemas/astra-stage2-executable-control-public.schema.json \
            schemas/astra-stage2-executable-control-set.schema.json
          do
            python3 -m json.tool "$schema" >/dev/null
          done
          PYTHONPATH=. python3 -m unittest discover \
            -s tests \
            -p 'test_astra_stage2_control_identity.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/control-id-bootstrap-tests.log"
          grep -q '^Ran 20 tests in ' "$RUNNER_TEMP/control-id-bootstrap-tests.log"
          PYTHONPATH=. python3 scripts/astra_stage2_bind_controls.py template \
            --out "$RUNNER_TEMP/binding-template.generated.json"
          diff -u \
            experiments/astra_kxr/stage2/control_identity/binding-template.json \
            "$RUNNER_TEMP/binding-template.generated.json"
          mapfile -t observed < <(git diff --name-only "$JOIN_HEAD" -- | sort)
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/workflows/astra-stage2-control-identity.yml
          astra_stage2/control_identity.py
          docs/agents/claims/FRR-ASTRA-STAGE2-CONTROL-IDENTITY-1.md
          experiments/astra_kxr/stage2/control_identity/README.md
          experiments/astra_kxr/stage2/control_identity/binding-template.json
          schemas/astra-stage2-control-binding-input.schema.json
          schemas/astra-stage2-executable-control-private.schema.json
          schemas/astra-stage2-executable-control-public.schema.json
          schemas/astra-stage2-executable-control-set.schema.json
          scripts/astra_stage2_bind_controls.ps1
          scripts/astra_stage2_bind_controls.py
          tests/test_astra_stage2_control_identity.py
          EOF
          printf '%s\n' "${observed[@]}" > "$RUNNER_TEMP/observed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/observed-paths.txt"

      - name: Commit and push exact payload to target branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOIN_HEAD: f6b24be2a2c411444f0d4005aed3bd61769733a5
          TARGET_BRANCH: joint/astra-stage2-control-identities-20260903
        run: |
          set -euo pipefail
          git add -- \
            .github/workflows/astra-stage2-control-identity.yml \
            astra_stage2/control_identity.py \
            docs/agents/claims/FRR-ASTRA-STAGE2-CONTROL-IDENTITY-1.md \
            experiments/astra_kxr/stage2/control_identity/README.md \
            experiments/astra_kxr/stage2/control_identity/binding-template.json \
            schemas/astra-stage2-control-binding-input.schema.json \
            schemas/astra-stage2-executable-control-private.schema.json \
            schemas/astra-stage2-executable-control-public.schema.json \
            schemas/astra-stage2-executable-control-set.schema.json \
            scripts/astra_stage2_bind_controls.ps1 \
            scripts/astra_stage2_bind_controls.py \
            tests/test_astra_stage2_control_identity.py
          test "$(git diff --cached --name-only "$JOIN_HEAD" -- | wc -l)" -eq 12
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "feat(astra): bind executable calibration identities" \
            -m "Add the provider-free control-identity binder, private and public receipt contracts, deterministic 648-cell plan binding, Windows entrypoint, hostile tests, and exact-head qualification workflow. Actual model identities remain unbound until local evidence is supplied."
          target_head="$(git rev-parse HEAD)"
          target_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "$JOIN_HEAD"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'target_head=%s\n' "$target_head" >> "$GITHUB_OUTPUT"
          printf 'target_tree=%s\n' "$target_tree" >> "$GITHUB_OUTPUT"
          {
            echo "target_head=$target_head"
            echo "target_tree=$target_tree"
            echo "parent=$JOIN_HEAD"
            echo "changed_paths=12"
            echo "tests=20"
            echo "provider_or_model_calls=0"
            echo "actual_control_identities=UNBOUND"
          } >> "$GITHUB_STEP_SUMMARY"
