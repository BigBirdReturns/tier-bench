name: astra-stage2-control-identity-successor-scope-audit

on:
  push:
    branches:
      - audit/astra-stage2-control-identity-successor-scope-4684-20260903

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-stage2-control-identity-successor-scope-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-independent-audit:
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      receipt_b64: ${{ steps.seal.outputs.receipt_b64 }}
      receipt_sha256: ${{ steps.seal.outputs.receipt_sha256 }}
    steps:
      - name: Check out exact audit head and bind final release parent
        id: custody
        shell: pwsh
        env:
          EXPECTED_AUDIT_HEAD: ${{ github.sha }}
          AUDIT_BRANCH: audit/astra-stage2-control-identity-successor-scope-4684-20260903
          RELEASE_HEAD: 46840d9ce0e3732b84cd4ad40e828c42326bcc05
          RELEASE_TREE: ea4e5ececd37bf440af5c01bfe416cd5df8304a5
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed' }
          $refspec = "+refs/heads/{0}:refs/successor-scope-audit/candidate" -f $env:AUDIT_BRANCH
          git fetch --no-tags --depth=160 origin $refspec
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git checkout --detach refs/successor-scope-audit/candidate
          if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }

          $auditHead = (git rev-parse HEAD).Trim()
          $auditTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($auditHead -ne $env:EXPECTED_AUDIT_HEAD) {
            throw "Audit head mismatch: $auditHead"
          }
          $releaseTree = (git rev-parse "$($env:RELEASE_HEAD)^{tree}").Trim()
          if ($releaseTree -ne $env:RELEASE_TREE) {
            throw "Release tree mismatch: $releaseTree"
          }
          git merge-base --is-ancestor $env:RELEASE_HEAD $auditHead
          if ($LASTEXITCODE -ne 0) {
            throw 'Audit is not descended from exact release head'
          }

          "audit_head=$auditHead" >> $env:GITHUB_OUTPUT
          "audit_tree=$auditTree" >> $env:GITHUB_OUTPUT

      - name: Run complete 27-test suite independently on Windows
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'python is unavailable' }

          python -m py_compile `
            astra_stage2/control_identity.py `
            scripts/astra_stage2_bind_controls.py `
            tests/test_astra_stage2_control_identity.py `
            tests/test_astra_stage2_control_identity_release.py `
            audits/astra_stage2_control_identity_successor_scope_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }

          $lines = @(
            & python -m unittest discover `
              -s tests `
              -p 'test_astra_stage2_control_identity*.py' `
              -v 2>&1
          )
          $exitCode = $LASTEXITCODE
          $log = Join-Path $env:RUNNER_TEMP 'test-control-identity-successor-scope-audit-windows.log'
          $lines | Set-Content -Encoding utf8 $log
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Independent Windows suite failed with exit code $exitCode"
          }

          $joined = $lines -join "`n"
          if ($joined -notmatch '(?m)^Ran 27 tests in ') {
            throw 'Independent Windows test denominator is not 27'
          }
          if ($joined -notmatch '(?m)^OK \(skipped=1\)$') {
            throw 'Independent Windows suite did not finish with one expected skip'
          }
          "log=$log" >> $env:GITHUB_OUTPUT

      - name: Parse launcher with terminating Windows PowerShell semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $PWD 'scripts\Invoke-AstraStage2ControlIdentityBinding.ps1'
          $text = Get-Content -Raw -LiteralPath $launcher
          try {
            [void][scriptblock]::Create($text)
          }
          catch {
            throw "PowerShell parser rejected launcher: $($_.Exception.Message)"
          }
          Write-Host 'POWERSHELL_PARSE_PASS'

      - name: Verify predecessor workflow successor scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD '.github\workflows\astra-stage2-control-identity.yml'
          $text = Get-Content -Raw -LiteralPath $path
          $pullRequestPattern = '(?ms)^  pull_request:\r?\n    branches:\r?\n      - joint/astra-stage2-calibration-impl-20260902\r?\n    paths:'
          if ($text -notmatch $pullRequestPattern) {
            throw 'Predecessor workflow is not scoped to its original PR base'
          }
          $pushPattern = '(?ms)^  push:\r?\n    branches:\r?\n      - joint/astra-stage2-control-identities-20260903'
          if ($text -notmatch $pushPattern) {
            throw 'Predecessor workflow lost its exact candidate push lane'
          }
          Write-Host 'PREDECESSOR_WORKFLOW_SUCCESSOR_SCOPE_PASS'

      - name: Execute Preflight from an empty non-repository working directory
        id: preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutRoot = (Get-Location).Path
          $launcher = Join-Path $checkoutRoot 'scripts\Invoke-AstraStage2ControlIdentityBinding.ps1'
          $callerRoot = Join-Path $env:RUNNER_TEMP 'astra-successor-scope-non-repository-caller'
          $custodyRoot = Join-Path $env:RUNNER_TEMP 'astra-successor-scope-independent-preflight'
          New-Item -ItemType Directory -Force -Path $callerRoot | Out-Null

          $callerTop = & git -C $callerRoot rev-parse --show-toplevel 2>$null
          if ($LASTEXITCODE -eq 0 -and $callerTop) {
            throw 'The independent Preflight caller unexpectedly belongs to a Git repository'
          }

          Push-Location -LiteralPath $callerRoot
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File $launcher `
              -Mode Preflight `
              -RepoRoot $checkoutRoot `
              -CustodyRoot $custodyRoot `
              -Python python
            if ($LASTEXITCODE -ne 0) {
              throw "Independent Preflight failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          $receiptPath = Join-Path $custodyRoot 'PREFLIGHT-RECEIPT.json'
          $probePath = Join-Path $custodyRoot 'PREFLIGHT-BINDER-TEMPLATE.json'
          if (-not (Test-Path -LiteralPath $receiptPath)) {
            throw 'Independent Preflight receipt is absent'
          }
          if (-not (Test-Path -LiteralPath $probePath)) {
            throw 'Independent binder template probe is absent'
          }

          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.schema -ne 'tier-bench/astra-stage2-control-identity-preflight@2') {
            throw "Unexpected Preflight schema: $($receipt.schema)"
          }
          if ($receipt.state -ne 'PREFLIGHT_PASS') {
            throw "Unexpected Preflight state: $($receipt.state)"
          }
          if ($receipt.binder_command_import_probe -ne 'PASS') {
            throw 'Preflight did not pass the pinned binder import probe'
          }
          if ($receipt.binder_command -ne 'template') {
            throw 'Preflight did not exercise the pinned template command'
          }
          if ($receipt.downloads_performed -ne $false) {
            throw 'Preflight performed downloads'
          }
          if ($receipt.model_calls -ne 0 -or $receipt.provider_calls -ne 0) {
            throw 'Preflight widened call authority'
          }
          if ($receipt.actual_executable_control_identities -ne 'UNBOUND') {
            throw 'Preflight widened executable identity authority'
          }
          if (Test-Path -LiteralPath (Join-Path $custodyRoot 'models')) {
            throw 'Independent Preflight created model custody'
          }

          $canonicalCaller = [System.IO.Path]::GetFullPath($callerRoot)
          $recordedCaller = [System.IO.Path]::GetFullPath([string]$receipt.caller_working_directory)
          if (-not [string]::Equals(
              $canonicalCaller,
              $recordedCaller,
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Preflight did not record the empty non-repository caller directory'
          }

          $canonicalBinder = [System.IO.Path]::GetFullPath([string]$receipt.binder_root)
          $commandDirectory = [System.IO.Path]::GetFullPath([string]$receipt.binder_command_working_directory)
          $pythonPathRoot = [System.IO.Path]::GetFullPath([string]$receipt.binder_pythonpath_root)
          if (-not [string]::Equals(
              $canonicalBinder,
              $commandDirectory,
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Binder command did not execute from the exact BinderRoot'
          }
          if (-not [string]::Equals(
              $canonicalBinder,
              $pythonPathRoot,
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'BinderRoot was not bound as the exact Python import root'
          }

          $probeDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $probePath).Hash.ToLowerInvariant()
          if ($probeDigest -ne $receipt.binder_template_probe_sha256) {
            throw 'Binder template probe digest differs from the Preflight receipt'
          }
          if ($probeDigest -ne '0292bf17538352f2c27799254bf951418fa517c1ff81f26223c736ea5e89900d') {
            throw 'Binder template probe digest differs from the frozen template'
          }
          $probe = Get-Content -Raw -LiteralPath $probePath | ConvertFrom-Json
          if ($probe.law.blob_sha1 -ne '77abe4e177fc61e4f52f56ea64494b113f9662fc') {
            throw 'Binder template probe law blob differs'
          }
          if ($probe.scaffold.head_sha1 -ne '9babad4631ef517485c56ea4906aab123e30fad7') {
            throw 'Binder template probe scaffold head differs'
          }
          if ($probe.stage1_join_head -ne '60bca963d63edca267106bc5c7725c2cc1df8dd7') {
            throw 'Binder template probe Stage 1 join differs'
          }
          if (@($probe.controls).Count -ne 3) {
            throw 'Binder template probe does not expose exactly three controls'
          }

          "receipt=$receiptPath" >> $env:GITHUB_OUTPUT
          "probe=$probePath" >> $env:GITHUB_OUTPUT
          "caller=$callerRoot" >> $env:GITHUB_OUTPUT

      - name: Seal independent Windows successor-scope receipt
        id: seal
        shell: pwsh
        env:
          RELEASE_HEAD: 46840d9ce0e3732b84cd4ad40e828c42326bcc05
          RELEASE_TREE: ea4e5ececd37bf440af5c01bfe416cd5df8304a5
          TEST_LOG: ${{ steps.tests.outputs.log }}
          PREFLIGHT_RECEIPT: ${{ steps.preflight.outputs.receipt }}
          BINDER_TEMPLATE_PROBE: ${{ steps.preflight.outputs.probe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $value = [ordered]@{
            schema = 'tier-bench/astra-stage2-control-identity-successor-scope-windows-audit@1'
            release_head_sha1 = $env:RELEASE_HEAD
            release_tree_sha1 = $env:RELEASE_TREE
            runner = 'windows-2025'
            tests = 27
            passed = 26
            skipped = 1
            failed = 0
            errors = 0
            powershell_parse = 'PASS'
            launcher_preflight = 'PASS'
            preflight_schema = 'tier-bench/astra-stage2-control-identity-preflight@2'
            binder_command_import_probe = 'PASS'
            binder_command = 'template'
            caller_is_non_repository = $true
            predecessor_workflow_successor_scope = 'PASS'
            preflight_downloads = 0
            model_calls = 0
            provider_calls = 0
            actual_executable_control_identities = 'UNBOUND'
            test_log_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:TEST_LOG).Hash.ToLowerInvariant()
            preflight_receipt_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:PREFLIGHT_RECEIPT).Hash.ToLowerInvariant()
            binder_template_probe_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:BINDER_TEMPLATE_PROBE).Hash.ToLowerInvariant()
          }
          $json = $value | ConvertTo-Json -Compress
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $b64 = [Convert]::ToBase64String($bytes)
          $stream = [System.IO.MemoryStream]::new($bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -InputStream $stream).Hash.ToLowerInvariant()
          "receipt_b64=$b64" >> $env:GITHUB_OUTPUT
          "receipt_sha256=$sha" >> $env:GITHUB_OUTPUT
          $json >> $env:GITHUB_STEP_SUMMARY

  independent-provider-free-audit:
    needs: windows-independent-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact audit head
        id: custody
        shell: bash
        env:
          AUDIT_BRANCH: audit/astra-stage2-control-identity-successor-scope-4684-20260903
          EXPECTED_AUDIT_HEAD: ${{ github.sha }}
          RELEASE_HEAD: 46840d9ce0e3732b84cd4ad40e828c42326bcc05
          RELEASE_TREE: ea4e5ececd37bf440af5c01bfe416cd5df8304a5
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=192 origin \
            "+refs/heads/${AUDIT_BRANCH}:refs/successor-scope-audit/candidate"
          git checkout --detach refs/successor-scope-audit/candidate

          audit_head="$(git rev-parse HEAD)"
          audit_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$audit_head" = "$EXPECTED_AUDIT_HEAD"
          test "$(git rev-parse "${RELEASE_HEAD}^{tree}")" = "$RELEASE_TREE"
          git merge-base --is-ancestor "$RELEASE_HEAD" "$audit_head"

          evidence_root="$RUNNER_TEMP/astra-stage2-control-identity-successor-scope-audit"
          mkdir -p "$evidence_root"
          printf 'audit_head=%s\n' "$audit_head" >> "$GITHUB_OUTPUT"
          printf 'audit_tree=%s\n' "$audit_tree" >> "$GITHUB_OUTPUT"
          printf 'evidence_root=%s\n' "$evidence_root" >> "$GITHUB_OUTPUT"

      - name: Refuse provider credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          names = [
              'OPENAI_API_KEY',
              'ANTHROPIC_API_KEY',
              'GEMINI_API_KEY',
              'GOOGLE_API_KEY',
              'MISTRAL_API_KEY',
              'COHERE_API_KEY',
              'XAI_API_KEY',
              'GROQ_API_KEY',
              'TOGETHER_API_KEY',
              'FIREWORKS_API_KEY',
          ]
          present = [name for name in names if os.environ.get(name)]
          if present:
              raise SystemExit(
                  'recognized provider credentials present: ' + ','.join(present)
              )
          PY

      - name: Materialize independent Windows successor-scope receipt
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ steps.custody.outputs.evidence_root }}
          WINDOWS_RECEIPT_B64: ${{ needs.windows-independent-audit.outputs.receipt_b64 }}
          WINDOWS_RECEIPT_SHA256: ${{ needs.windows-independent-audit.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$WINDOWS_RECEIPT_B64" \
            | base64 --decode \
            > "$EVIDENCE_ROOT/windows-successor-scope-audit-receipt.json"
          observed="$(sha256sum "$EVIDENCE_ROOT/windows-successor-scope-audit-receipt.json" | awk '{print $1}')"
          test "$observed" = "$WINDOWS_RECEIPT_SHA256"
          python3 -m json.tool \
            "$EVIDENCE_ROOT/windows-successor-scope-audit-receipt.json" \
            >/dev/null

      - name: Download exact final release artifacts by immutable ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ steps.custody.outputs.evidence_root }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9911030201/zip" \
            -o "$EVIDENCE_ROOT/release-evidence.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9911030700/zip" \
            -o "$EVIDENCE_ROOT/release-publication.zip"
          cat > "$EVIDENCE_ROOT/expected-release.sha256" <<'EOF'
          5ef88d820bc866c1df02015b6b1725fb09f447a450126ada0dfe8eb7896f7a1f  release-evidence.zip
          c184cc19b3e783bba518ddf05d30236e58fd46ac9a6539aec0ae49a73f59f7bb  release-publication.zip
          EOF
          (cd "$EVIDENCE_ROOT" && sha256sum -c expected-release.sha256)

      - name: Rerun complete 27-test suite independently on Linux
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ steps.custody.outputs.evidence_root }}
        run: |
          set -euo pipefail
          python3 -m py_compile \
            astra_stage2/control_identity.py \
            scripts/astra_stage2_bind_controls.py \
            tests/test_astra_stage2_control_identity.py \
            tests/test_astra_stage2_control_identity_release.py \
            audits/astra_stage2_control_identity_successor_scope_audit.py
          PYTHONPATH=. python3 -m unittest discover \
            -s tests \
            -p 'test_astra_stage2_control_identity*.py' \
            -v 2>&1 \
            | tee "$EVIDENCE_ROOT/test-control-identity-successor-scope-audit-linux.log"
          grep -q '^Ran 27 tests in ' \
            "$EVIDENCE_ROOT/test-control-identity-successor-scope-audit-linux.log"
          grep -q '^OK$' \
            "$EVIDENCE_ROOT/test-control-identity-successor-scope-audit-linux.log"

      - name: Execute independent artifact and authority audit
        id: audit
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ steps.custody.outputs.evidence_root }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 \
            audits/astra_stage2_control_identity_successor_scope_audit.py \
            --repo-root . \
            --evidence-zip "$EVIDENCE_ROOT/release-evidence.zip" \
            --publication-zip "$EVIDENCE_ROOT/release-publication.zip" \
            --windows-audit-receipt \
              "$EVIDENCE_ROOT/windows-successor-scope-audit-receipt.json" \
            --out "$EVIDENCE_ROOT/audit-result.json"

          python3 - "$EVIDENCE_ROOT/audit-result.json" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['disposition'] == (
              'PASS_SUCCESSOR_SCOPE_AND_BINDER_IMPORT_PROVIDER_FREE_RELEASE_ONLY'
          )
          assert value['attack_count'] == value['refused_count'] == 7
          assert value['failed_count'] == 0
          assert value['rederived']['tests_linux'] == 27
          assert value['rederived']['tests_windows'] == 27
          assert value['rederived']['windows_failed'] == 0
          assert value['rederived']['windows_errors'] == 0
          assert value['rederived']['binder_command_import_probe'] == 'PASS'
          assert value['rederived']['caller_is_non_repository'] is True
          assert value['rederived']['predecessor_workflow_successor_scope'] is True
          assert value['rederived']['actual_executable_control_identities'] == 'UNBOUND'
          assert value['authority']['provider_or_model_calls'] == 0
          PY

          printf 'audit_payload=%s\n' \
            "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["payload_sha256"])' "$EVIDENCE_ROOT/audit-result.json")" \
            >> "$GITHUB_OUTPUT"
          cat "$EVIDENCE_ROOT/audit-result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Seal independent audit package
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ steps.custody.outputs.evidence_root }}
        run: |
          set -euo pipefail
          cp audits/astra_stage2_control_identity_successor_scope_audit.py \
            "$EVIDENCE_ROOT/audit-source.py"
          cp .github/workflows/astra-stage2-control-identity-successor-scope-audit.yml \
            "$EVIDENCE_ROOT/audit-workflow.yml"
          cp .github/workflows/astra-stage2-control-identity.yml \
            "$EVIDENCE_ROOT/predecessor-control-identity-workflow.yml"
          cp scripts/Invoke-AstraStage2ControlIdentityBinding.ps1 \
            "$EVIDENCE_ROOT/Invoke-AstraStage2ControlIdentityBinding.ps1"
          (
            cd "$EVIDENCE_ROOT"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
          )

      - name: Upload fresh independent successor-scope audit
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-stage2-control-identity-successor-scope-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custody.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish exact audit coordinates
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.artifact.outputs.artifact-id }}"
          test -n "${{ steps.artifact.outputs.artifact-digest }}"
          {
            echo
            echo "audit_head=${{ steps.custody.outputs.audit_head }}"
            echo "audit_tree=${{ steps.custody.outputs.audit_tree }}"
            echo "audit_payload=${{ steps.audit.outputs.audit_payload }}"
            echo "artifact_id=${{ steps.artifact.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.artifact.outputs.artifact-digest }}"
            echo "release_head=46840d9ce0e3732b84cd4ad40e828c42326bcc05"
            echo "release_tree=ea4e5ececd37bf440af5c01bfe416cd5df8304a5"
          } >> "$GITHUB_STEP_SUMMARY"
