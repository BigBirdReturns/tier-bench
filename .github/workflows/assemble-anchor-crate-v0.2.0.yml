# One-use exact-payload assembler. The pull-request trigger makes the run observable and retriable.
name: assemble-anchor-crate-v0.2.0

on:
  push:
    branches: [feature/community-home-lab-anchor-crate-v0.2.0]
  pull_request:
    branches: [agent/menace-edge-qualification-v1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/community-home-lab-anchor-crate-v0.2.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct exact payload
        run: |
          cat transport/anchor-crate-payload.part-*.b64 > "$RUNNER_TEMP/anchor-crate-payload.b64"
          base64 --decode "$RUNNER_TEMP/anchor-crate-payload.b64" > "$RUNNER_TEMP/anchor-crate-payload.tar.gz"
          echo "3b10ef72125473b38eef1c3ba693e53a6134b6ba8df2c16db084330cef612511  $RUNNER_TEMP/anchor-crate-payload.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/anchor-crate-payload.tar.gz" -C .

      - name: Qualify assembled source
        run: |
          python -m py_compile \
            tier_runner/anchor_crate_common.py \
            tier_runner/anchor_crate_schema.py \
            tier_runner/anchor_crate_plan.py \
            tier_runner/anchor_crate_runtime.py \
            tier_runner/anchor_crate.py \
            examples/anchor_crate/reference_executor.py \
            scripts/verify_anchor_crate_bundle.py \
            tests/test_anchor_crate.py
          python scripts/verify_anchor_crate_bundle.py --repo .
          python tests/test_anchor_crate.py
          python -m tier_runner.anchor_crate validate \
            --floor labs/community-home-lab/anchor-crate/floor.json \
            --cartridge labs/community-home-lab/anchor-crate/physical_availability_cartridge.json \
            --backends labs/community-home-lab/anchor-crate/backend_registry.json
          python -m tier_runner.anchor_crate compare \
            --floor labs/community-home-lab/anchor-crate/floor.json \
            --cartridge labs/community-home-lab/anchor-crate/physical_availability_cartridge.json \
            --backends labs/community-home-lab/anchor-crate/backend_registry.json \
            --node generate_decision_packet \
            --backend-a backend.cuda3090-fixture \
            --backend-b backend.riscv-llm-fixture \
            --out "$RUNNER_TEMP/backend-equivalence.json"
          cmp "$RUNNER_TEMP/backend-equivalence.json" labs/community-home-lab/anchor-crate/backend_equivalence.json
          git diff --check

      - name: Commit reviewable source and remove transport
        run: |
          rm -f transport/anchor-crate-payload.part-*.b64
          rm -f .github/workflows/assemble-anchor-crate-v0.2.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build the Community Home Lab Anchor Crate execution floor"
          git push origin HEAD:feature/community-home-lab-anchor-crate-v0.2.0
