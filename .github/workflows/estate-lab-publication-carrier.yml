name: One-shot AXM Estate Lab publication carrier

on:
  push:
    branches: [agent/axm-estate-lab]
    paths: ['.estate-lab-publication-trigger']
  pull_request:
    branches: [main]
    paths: ['.estate-lab-publication-trigger']

permissions:
  contents: write

concurrency:
  group: estate-lab-publication-carrier
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/axm-estate-lab
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize the remaining validated Estate Lab source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, io, lzma, tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          parts = [root / f'.estate-lab-payload-{index:02d}' for index in range(6)]
          payload = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          archive_bytes = lzma.decompress(base64.b64decode(payload, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  target = (root / member.name).resolve()
                  target.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'missing payload for {member.name}')
                  target.write_bytes(source.read())

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          bullet = '- **[AXM Estate Lab](estate_lab/README.md)** — exercise cross-project semantic actions, authority, fallback routing, deterministic state, device substitutions, project probes, and fault recovery with inspectable receipts.'
          anchor = '- **[Capability harness](capability_harness/README.md)** — lift a cheap model to the tier above on operational tasks, any provider. `pip install .`, then `capability-harness review mycode.py`.'
          if bullet not in text:
              if anchor not in text:
                  raise SystemExit('Tier Bench README capability-program anchor moved')
              readme.write_text(text.replace(anchor + '\n', anchor + '\n' + bullet + '\n', 1), encoding='utf-8', newline='\n')

          Path('.github/workflows/estate-lab-publication-carrier.yml').unlink()
          Path('.estate-lab-publication-trigger').unlink()
          for path in parts:
              path.unlink()
          PY

      - name: Qualify the final tree
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile estate_lab/*.py estate_lab/scripts/run_reference_lab.py
          python -m estate_lab validate
          python -m unittest discover -s estate_lab/tests -v
          rm -rf .estate-lab-runs
          python -m estate_lab run-all --output .estate-lab-runs
          git diff --check

      - name: Publish the carrier-free source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add the AXM Estate Lab'
          git push origin HEAD:agent/axm-estate-lab
