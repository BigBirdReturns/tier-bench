name: materialize-astra-successor-scope-files

on:
  push:
    branches:
      - repair/astra-stage2-successor-ci-scope-builder-20260903

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate the two exact replacement files
        id: generate
        shell: bash
        env:
          BASE_HEAD: 125fdc367920960421d1e080900f1806637277f4
          BASE_TREE: ccab08e1192346f9c386b0f41ffaab77bac73194
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all remote.origin.fetch || true
          git -c protocol.version=2 fetch --no-tags --depth=64 origin \
            "+${BASE_HEAD}:refs/scope-files/base"
          git checkout --detach refs/scope-files/base
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"

          python3 - <<'PY'
          from pathlib import Path

          predecessor_path = Path('.github/workflows/astra-stage2-control-identity.yml')
          predecessor = predecessor_path.read_text(encoding='utf-8')
          old = '  pull_request:\n    paths:\n'
          new = (
              '  pull_request:\n'
              '    branches:\n'
              '      - joint/astra-stage2-calibration-impl-20260902\n'
              '    paths:\n'
          )
          if predecessor.count(old) != 1:
              raise SystemExit('predecessor trigger anchor mismatch')
          predecessor_path.write_text(
              predecessor.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )

          release_path = Path('.github/workflows/astra-stage2-control-identity-release.yml')
          release = release_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '          expected = {\n'
                  '              ".github/workflows/astra-stage2-control-identity-release.yml",\n',
                  '          expected = {\n'
                  '              ".github/workflows/astra-stage2-control-identity-release.yml",\n'
                  '              ".github/workflows/astra-stage2-control-identity.yml",\n',
                  'release path set',
              ),
              (
                  '          if observed != expected:\n'
                  '              raise SystemExit(\n'
                  '                  f"release path set mismatch: expected={sorted(expected)}, "\n'
                  '                  f"observed={sorted(observed)}"\n'
                  '              )\n'
                  '          PY\n',
                  '          if observed != expected:\n'
                  '              raise SystemExit(\n'
                  '                  f"release path set mismatch: expected={sorted(expected)}, "\n'
                  '                  f"observed={sorted(observed)}"\n'
                  '              )\n'
                  '\n'
                  '          predecessor = Path(\n'
                  '              ".github/workflows/astra-stage2-control-identity.yml"\n'
                  '          ).read_text(encoding="utf-8")\n'
                  '          required_scope = (\n'
                  '              "  pull_request:\\n"\n'
                  '              "    branches:\\n"\n'
                  '              "      - joint/astra-stage2-calibration-impl-20260902\\n"\n'
                  '              "    paths:\\n"\n'
                  '          )\n'
                  '          if required_scope not in predecessor:\n'
                  '              raise SystemExit(\n'
                  '                  "predecessor workflow lacks its exact PR-base scope"\n'
                  '              )\n'
                  '          required_push = (\n'
                  '              "  push:\\n"\n'
                  '              "    branches:\\n"\n'
                  '              "      - joint/astra-stage2-control-identities-20260903\\n"\n'
                  '          )\n'
                  '          if required_push not in predecessor:\n'
                  '              raise SystemExit(\n'
                  '                  "predecessor workflow lost its candidate push lane"\n'
                  '              )\n'
                  '          PY\n',
                  'scope verification',
              ),
              (
                  '          cp scripts/Invoke-AstraStage2ControlIdentityBinding.ps1 \\\n'
                  '            "$EVIDENCE_ROOT/Invoke-AstraStage2ControlIdentityBinding.ps1"\n',
                  '          cp .github/workflows/astra-stage2-control-identity.yml \\\n'
                  '            "$EVIDENCE_ROOT/predecessor-control-identity-workflow.yml"\n'
                  '          cp scripts/Invoke-AstraStage2ControlIdentityBinding.ps1 \\\n'
                  '            "$EVIDENCE_ROOT/Invoke-AstraStage2ControlIdentityBinding.ps1"\n',
                  'evidence copy',
              ),
              (
                  '                  "repository_root_discovery_tested": True,\n'
                  '                  "cross_platform_runtime_fixture": True,\n',
                  '                  "repository_root_discovery_tested": True,\n'
                  '                  "predecessor_workflow_successor_scope": True,\n'
                  '                  "cross_platform_runtime_fixture": True,\n',
                  'qualification conformance',
              ),
              (
                  '              "pinned_launcher": (\n'
                  '                  "Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
                  '              ),\n'
                  '              "actual_control_identities": "UNBOUND",\n',
                  '              "pinned_launcher": (\n'
                  '                  "Invoke-AstraStage2ControlIdentityBinding.ps1"\n'
                  '              ),\n'
                  '              "predecessor_workflow_successor_scope": True,\n'
                  '              "actual_control_identities": "UNBOUND",\n',
                  'publication scope',
              ),
          ]
          for before, after, label in replacements:
              if release.count(before) != 1:
                  raise SystemExit(f'{label} anchor mismatch')
              release = release.replace(before, after, 1)

          release_path.write_text(release, encoding='utf-8', newline='\n')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2

          out="$RUNNER_TEMP/astra-successor-scope-files"
          mkdir -p "$out"
          cp .github/workflows/astra-stage2-control-identity.yml \
            "$out/astra-stage2-control-identity.yml"
          cp .github/workflows/astra-stage2-control-identity-release.yml \
            "$out/astra-stage2-control-identity-release.yml"
          (
            cd "$out"
            sha256sum \
              astra-stage2-control-identity.yml \
              astra-stage2-control-identity-release.yml \
              > SHA256SUMS
          )
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Upload replacement files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-successor-scope-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.generate.outputs.out }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
