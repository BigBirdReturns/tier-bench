name: AXM action player floor

on:
  pull_request:
    paths:
      - 'action_player_floor/**'
      - 'ACTION_PLAYER_FLOOR.md'
      - '.github/workflows/action-player-floor.yml'
      - 'README.md'
      - 'HANDOFF.md'
  push:
    branches:
      - main
    paths:
      - 'action_player_floor/**'
      - 'ACTION_PLAYER_FLOOR.md'
      - '.github/workflows/action-player-floor.yml'
      - 'README.md'
      - 'HANDOFF.md'

permissions:
  contents: read

concurrency:
  group: action-player-floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and test the consolidated floor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile action_player_floor/floor.py
          python -m unittest discover -s action_player_floor/tests -v
          python action_player_floor/floor.py validate \
            --catalog action_player_floor/catalog.json \
            --intent action_player_floor/examples/underdrain.player-intent.json \
            --witnesses action_player_floor/examples/negative-witnesses.json \
            --changes action_player_floor/examples/change-proposals.json

      - name: Reconstruct and package the complete self-verifying floor
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/action-player-floor"
          mkdir -p \
            "$root/action_player_floor/examples" \
            "$root/action_player_floor/tests"

          python action_player_floor/floor.py report \
            --catalog action_player_floor/catalog.json \
            --intent action_player_floor/examples/underdrain.player-intent.json \
            --witnesses action_player_floor/examples/negative-witnesses.json \
            --changes action_player_floor/examples/change-proposals.json \
            --output "$root/action_player_floor/examples/floor-report.json"
          cmp \
            "$root/action_player_floor/examples/floor-report.json" \
            action_player_floor/examples/floor-report.json

          cp ACTION_PLAYER_FLOOR.md "$root/"
          cp action_player_floor/README.md "$root/action_player_floor/"
          cp action_player_floor/START_HERE.md "$root/action_player_floor/"
          cp action_player_floor/CONTINUITY.md "$root/action_player_floor/"
          cp action_player_floor/COMMUNITY_MAP.md "$root/action_player_floor/"
          cp action_player_floor/AGENTS.md "$root/action_player_floor/"
          cp action_player_floor/CLAUDE.md "$root/action_player_floor/"
          cp action_player_floor/ACCEPTED_FLOOR.json "$root/action_player_floor/"
          cp action_player_floor/FANOUT.md "$root/action_player_floor/"
          cp action_player_floor/catalog.json "$root/action_player_floor/"
          cp action_player_floor/floor.py "$root/action_player_floor/"
          cp action_player_floor/examples/underdrain.player-intent.json "$root/action_player_floor/examples/"
          cp action_player_floor/examples/negative-witnesses.json "$root/action_player_floor/examples/"
          cp action_player_floor/examples/change-proposals.json "$root/action_player_floor/examples/"
          cp action_player_floor/tests/test_floor.py "$root/action_player_floor/tests/"
          printf '%s\n' "$(git rev-parse HEAD)" > "$root/repository-head.txt"

          python "$root/action_player_floor/floor.py" validate \
            --catalog "$root/action_player_floor/catalog.json" \
            --intent "$root/action_player_floor/examples/underdrain.player-intent.json" \
            --witnesses "$root/action_player_floor/examples/negative-witnesses.json" \
            --changes "$root/action_player_floor/examples/change-proposals.json"
          python -m unittest discover -s "$root/action_player_floor/tests" -v
          python "$root/action_player_floor/floor.py" report \
            --catalog "$root/action_player_floor/catalog.json" \
            --intent "$root/action_player_floor/examples/underdrain.player-intent.json" \
            --witnesses "$root/action_player_floor/examples/negative-witnesses.json" \
            --changes "$root/action_player_floor/examples/change-proposals.json" \
            --output "$root/reconstructed-report.json"
          cmp \
            "$root/reconstructed-report.json" \
            "$root/action_player_floor/examples/floor-report.json"

          find "$root" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$root" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          ! find "$root" \( -type d -name __pycache__ -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) -print -quit | grep -q .

          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          git diff --check
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: action-player-floor-python-${{ matrix.python }}
          path: ${{ runner.temp }}/action-player-floor
          if-no-files-found: error
          retention-days: 30

  release:
    name: cross-interpreter release
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: action-player-floor-python-*
          path: ${{ runner.temp }}/matrix

      - name: Prove byte-identical semantic contents
        shell: bash
        run: |
          set -euo pipefail
          left="$RUNNER_TEMP/matrix/action-player-floor-python-3.10"
          right="$RUNNER_TEMP/matrix/action-player-floor-python-3.12"
          test -d "$left"
          test -d "$right"
          diff -ruN "$left" "$right"
          cmp "$left/SHA256SUMS" "$right/SHA256SUMS"

          release="$RUNNER_TEMP/action-player-floor-release"
          mkdir -p "$release"
          cp -a "$left/." "$release/"
          LEFT="$left" RELEASE="$release" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          left = Path(os.environ['LEFT'])
          release = Path(os.environ['RELEASE'])
          manifest = left / 'SHA256SUMS'
          record = {
              'format': 'axm-action-player-floor-release/1',
              'status': 'pass',
              'repositoryHead': (left / 'repository-head.txt').read_text(encoding='utf-8').strip(),
              'pythonLanes': ['3.10', '3.12'],
              'contentManifestSha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'crossInterpreterContentEqual': True,
              'interpreterResiduePresent': False,
              'authority': 'release custody only; no player product is accepted',
          }
          (release / 'cross-interpreter-release.json').write_text(
              json.dumps(record, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          (
            cd "$release"
            find . -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: action-player-floor-release
          path: ${{ runner.temp }}/action-player-floor-release
          if-no-files-found: error
          retention-days: 30
