name: materialize-halo3-cell-zero-once

on:
  pull_request:
  push:
    branches: [feature/halo3-cell-zero-v0.1.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/halo3-cell-zero-v0.1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          CARRIER=".github/halo3-carrier"
          WORK="$RUNNER_TEMP/halo3-materialize"
          mkdir -p "$WORK/extract"
          cat "$CARRIER"/shard-*.b64 > "$WORK/archive.b64"
          base64 --decode "$WORK/archive.b64" > "$WORK/halo3-cell-zero-v0.1.0.tar.gz"
          echo "4878ec68e073fcaf469dc5f5f02eadf1488501985c83b2e20371d5a8b2e51e82  $WORK/halo3-cell-zero-v0.1.0.tar.gz" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = Path("${{ runner.temp }}") / "halo3-materialize" / "halo3-cell-zero-v0.1.0.tar.gz"
          allowed = {
              line.split("  ", 1)[1]
              for line in Path(".github/halo3-carrier/TARGET_SHA256SUMS").read_text().splitlines()
              if line.strip()
          }
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              names = {member.name for member in members if member.isfile()}
              if names != allowed:
                  raise SystemExit(f"archive path set differs: missing={sorted(allowed-names)} extra={sorted(names-allowed)}")
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              handle.extractall(Path("${{ runner.temp }}") / "halo3-materialize" / "extract")
          PY

          (
            cd "$WORK/extract"
            sha256sum -c "$GITHUB_WORKSPACE/$CARRIER/TARGET_SHA256SUMS"
          )

      - name: Install exact source tree and qualify
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/halo3-materialize/extract"
          while IFS= read -r path; do
            if [[ "$path" == ".github/workflows/halo3-cell-zero.yml" ]]; then
              continue
            fi
            mkdir -p "$(dirname "$path")"
            cp "$WORK/$path" "$path"
          done < <(awk '{print $2}' .github/halo3-carrier/TARGET_SHA256SUMS)

          python -m py_compile \
            tier_runner/halo3_cell_common.py \
            tier_runner/halo3_cell_schema.py \
            tier_runner/halo3_cell_plan.py \
            tier_runner/halo3_cell.py \
            tests/test_halo3_cell.py
          python tests/test_halo3_cell.py

          OUT="$RUNNER_TEMP/halo3-qualified"
          mkdir -p "$OUT"
          python -m tier_runner.halo3_cell validate \
            --lab labs/halo3-cell-zero/lab.json \
            --fingerprint labs/halo3-cell-zero/model_fingerprint_contract.json \
            > "$OUT/validation.json"
          python -m tier_runner.halo3_cell plan \
            --lab labs/halo3-cell-zero/lab.json \
            --fingerprint labs/halo3-cell-zero/model_fingerprint_contract.json \
            --out "$OUT/plan.json"
          python -m tier_runner.halo3_cell verify \
            --lab labs/halo3-cell-zero/lab.json \
            --fingerprint labs/halo3-cell-zero/model_fingerprint_contract.json \
            --plan "$OUT/plan.json"
          python -m tier_runner.halo3_cell proof-matrix \
            --lab labs/halo3-cell-zero/lab.json \
            --fingerprint labs/halo3-cell-zero/model_fingerprint_contract.json \
            --out-json "$OUT/proof_matrix.json" \
            --out-markdown "$OUT/PROOF_MATRIX.md"
          cmp labs/halo3-cell-zero/PROOF_MATRIX.md "$OUT/PROOF_MATRIX.md"
          python -m tier_runner.halo3_cell templates \
            --plan "$OUT/plan.json" \
            --out "$OUT/observation_templates.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}") / "halo3-qualified"
          plan = json.loads((root / "plan.json").read_text())
          matrix = json.loads((root / "proof_matrix.json").read_text())
          templates = json.loads((root / "observation_templates.json").read_text())
          assert plan["totals"]["cells"] == 66
          assert plan["totals"]["fingerprint_cells"] == 54
          assert matrix["totals"]["claims"] == 12
          assert matrix["totals"]["accepted"] == 0
          assert len(templates) == 66
          assert all(row["status"] == "unmeasured" for row in templates)
          assert plan["production_claim"] is False
          assert matrix["promotion_authorized"] is False
          PY
          git diff --check

      - name: Commit the qualified source and remove the carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/halo3-carrier
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build the HALO3 Cell Zero source floor"
          git push origin HEAD:feature/halo3-cell-zero-v0.1.0
