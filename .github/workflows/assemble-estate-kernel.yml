name: diagnose-estate-kernel-payload

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diagnose-estate-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estate-kernel-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record exact payload diagnostics
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path(".").resolve()
          names = [
              "estate_kernel_clean_payload.part-000.b64",
              "estate_kernel_clean_payload.part-001.b64",
              "estate_kernel_clean_payload.part-0020.b64",
              "estate_kernel_clean_payload.part-0021.b64",
              "estate_kernel_clean_payload.part-0022.b64",
              "estate_kernel_clean_payload.part-003.b64",
              "estate_kernel_clean_payload.part-004.b64",
              "estate_kernel_clean_payload.part-005.b64",
          ]
          chunks = []
          parts = []
          for name in names:
              path = root / "transport" / name
              raw = path.read_text(encoding="ascii")
              normalized = "".join(raw.split())
              parts.append(normalized)
              chunks.append({
                  "name": name,
                  "raw_length": len(raw),
                  "normalized_length": len(normalized),
                  "normalized_sha256": hashlib.sha256(normalized.encode()).hexdigest(),
                  "prefix": normalized[:24],
                  "suffix": normalized[-24:],
              })
          encoded = "".join(parts)
          result = {
              "schema": "tier-bench/estate-kernel-payload-diagnostic@1",
              "chunks": chunks,
              "combined_length": len(encoded),
              "combined_sha256": hashlib.sha256(encoded.encode()).hexdigest(),
              "expected_base64_length": 68424,
              "expected_zip_sha256": "4e4499d5663c2c481137711423dfe9397270e0385f3e6cb47343dd21dd1359ce",
          }
          try:
              payload = base64.b64decode(encoded, validate=True)
              result["decoded_length"] = len(payload)
              result["decoded_sha256"] = hashlib.sha256(payload).hexdigest()
              result["decode_error"] = None
          except Exception as exc:
              result["decoded_length"] = None
              result["decoded_sha256"] = None
              result["decode_error"] = f"{type(exc).__name__}: {exc}"
          target = root / "transport/estate_kernel_payload.diagnostic.json"
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "Estate Kernel Diagnostic"
          git config user.email "estate-kernel@users.noreply.github.com"
          git add transport/estate_kernel_payload.diagnostic.json
          git diff --cached --quiet || git commit -m "Record Estate Kernel payload diagnostics"
          git push origin HEAD:agent/estate-kernel-v1
