name: assemble-estate-kernel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: assemble-estate-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estate-kernel-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode, verify, and extract exact payload
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, zipfile
          root = pathlib.Path(".").resolve()
          carriers = sorted((root / "transport").glob("estate_kernel_clean_payload.part-*.b64"))
          if len(carriers) != 6:
              raise SystemExit(f"expected 6 clean chunks, found {len(carriers)}")
          encoded = "".join("".join(p.read_text(encoding="ascii").split()) for p in carriers)
          if len(encoded) != 68424:
              raise SystemExit(f"base64 length mismatch: {len(encoded)} != 68424")
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = "4e4499d5663c2c481137711423dfe9397270e0385f3e6cb47343dd21dd1359ce"
          if actual != expected:
              raise SystemExit(f"payload sha mismatch: {actual} != {expected}")
          archive = root / "transport/estate_kernel_clean_payload.zip"
          archive.write_bytes(payload)
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or path.parts[:1] == (".git",):
                      raise SystemExit(f"unsafe archive path: {name}")
              z.extractall(root)
          manifest = json.loads((root / "PAYLOAD_MANIFEST.json").read_text(encoding="utf-8"))
          for name, record in manifest["files"].items():
              path = root / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != record["sha256"]:
                  raise SystemExit(f"file sha mismatch: {name}")
          print(f"verified {len(manifest['files'])} files from {len(payload)} payload bytes")
          PY
      - name: Validate Estate Kernel without model calls
        run: |
          python -m py_compile \
            tier_runner/estate_common.py \
            tier_runner/estate_action_cache.py \
            tier_runner/estate_history.py \
            tier_runner/work_ir.py \
            tier_runner/verifier_factory.py \
            tier_runner/attention_broker.py \
            tier_runner/estate_kernel.py \
            tests/test_estate_kernel.py
          python tests/test_estate_kernel.py
          python -m tier_runner.estate_kernel action-key \
            --action experiments/estate_kernel/action.json \
            --runtime experiments/estate_kernel/runtime.json
          python -m tier_runner.estate_kernel workflow-validate \
            --workflow experiments/estate_kernel/workflow.json
          python -m tier_runner.estate_kernel ir-validate \
            --ir experiments/estate_kernel/work-ir.json \
            --executors experiments/estate_kernel/executors.json
          python -m tier_runner.estate_kernel ir-plan \
            --ir experiments/estate_kernel/work-ir.json \
            --executors experiments/estate_kernel/executors.json \
            --out /tmp/estate-ir-plan.json
          python -m tier_runner.estate_kernel ir-verify \
            --ir experiments/estate_kernel/work-ir.json \
            --executors experiments/estate_kernel/executors.json \
            --plan /tmp/estate-ir-plan.json
          python -m tier_runner.estate_kernel verifier-plan \
            --spec experiments/estate_kernel/verifier.json \
            --input experiments/estate_kernel/verifier-input.json \
            --out /tmp/verifier-plan.json
          python -m tier_runner.estate_kernel verifier-verify \
            --spec experiments/estate_kernel/verifier.json \
            --plan /tmp/verifier-plan.json
          python -m tier_runner.estate_kernel verifier-run \
            --spec experiments/estate_kernel/verifier.json \
            --plan /tmp/verifier-plan.json \
            --out /tmp/verifier-report.json
          python -m tier_runner.estate_kernel attention-plan \
            --requests experiments/estate_kernel/attention-requests.json \
            --policy experiments/estate_kernel/attention-policy.json \
            --out /tmp/attention-plan.json
          python -m tier_runner.estate_kernel attention-slo \
            --requests experiments/estate_kernel/attention-requests.json \
            --events experiments/estate_kernel/attention-events.json \
            --out /tmp/attention-slo.json
          python - <<'PY'
          import json
          ir = json.load(open("/tmp/estate-ir-plan.json", encoding="utf-8"))
          vr = json.load(open("/tmp/verifier-report.json", encoding="utf-8"))
          at = json.load(open("/tmp/attention-plan.json", encoding="utf-8"))
          assert ir["totals"]["logical_nodes"] == 3
          assert ir["totals"]["physical_actions"] == 2
          assert ir["totals"]["common_subwork_eliminated"] == 1
          assert vr["verdict"] == "PASS"
          assert at["totals"]["immediate_interruptions"] == 1
          assert at["totals"]["scheduled_batches"] == 1
          assert at["totals"]["returned_for_evidence"] == 1
          print("ESTATE_KERNEL_EXAMPLES_OK")
          PY
      - name: Commit reviewable source and remove transport
        run: |
          rm -f transport/estate_kernel_clean_payload.part-*.b64
          rm -f transport/estate_kernel_clean_payload.zip
          rm -f transport/estate_kernel_payload.part-*.b64
          rm -f PAYLOAD_MANIFEST.json
          rm -f .github/workflows/assemble-estate-kernel.yml
          git config user.name "Estate Kernel Assembler"
          git config user.email "estate-kernel@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Estate Kernel v1"
          git push origin HEAD:agent/estate-kernel-v1
