name: diagnose-estate-kernel-validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: diagnose-estate-kernel-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estate-kernel-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode and extract exact payload
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, zipfile
          root = pathlib.Path(".").resolve()
          names = [
              "estate_kernel_clean_payload.part-000.b64",
              "estate_kernel_clean_payload.part-001.b64",
              "estate_kernel_clean_payload.part-0020.b64",
              "estate_kernel_clean_payload.part-0021.b64",
              "estate_kernel_clean_payload.part-0022.b64",
              "estate_kernel_clean_payload.part-003.b64",
              "estate_kernel_clean_payload.part-004.b64",
              "estate_kernel_clean_payload.part-005.b64",
          ]
          encoded = "".join(
              "".join((root / "transport" / name).read_text(encoding="ascii").split())
              for name in names
          )
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = "3837085451744972316670b76856a237676c0e059909dd4cdb897a5ee3440585"
          if actual != expected:
              raise SystemExit(f"payload sha mismatch: {actual} != {expected}")
          with zipfile.ZipFile(root / "transport/estate_kernel_clean_payload.zip", "w") as out:
              pass
          archive = root / "transport/estate_kernel_clean_payload.zip"
          archive.write_bytes(payload)
          with zipfile.ZipFile(archive) as z:
              z.extractall(root)
          manifest = json.loads((root / "PAYLOAD_MANIFEST.json").read_text(encoding="utf-8"))
          for name, record in manifest["files"].items():
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if digest != record["sha256"]:
                  raise SystemExit(f"file sha mismatch: {name}")
          PY
      - name: Capture every validation command
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(".").resolve()
          commands = [
              [sys.executable, "-m", "py_compile", "tier_runner/estate_common.py", "tier_runner/estate_action_cache.py", "tier_runner/estate_history.py", "tier_runner/work_ir.py", "tier_runner/verifier_factory.py", "tier_runner/attention_broker.py", "tier_runner/estate_kernel.py", "tests/test_estate_kernel.py"],
              [sys.executable, "tests/test_estate_kernel.py"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "action-key", "--action", "experiments/estate_kernel/action.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "workflow-validate", "--workflow", "experiments/estate_kernel/workflow.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "ir-validate", "--ir", "experiments/estate_kernel/work-ir.json", "--executors", "experiments/estate_kernel/executors.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "ir-plan", "--ir", "experiments/estate_kernel/work-ir.json", "--executors", "experiments/estate_kernel/executors.json", "--out", "/tmp/estate-ir-plan.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "ir-verify", "--ir", "experiments/estate_kernel/work-ir.json", "--executors", "experiments/estate_kernel/executors.json", "--plan", "/tmp/estate-ir-plan.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "verifier-plan", "--spec", "experiments/estate_kernel/verifier.json", "--input", "experiments/estate_kernel/verifier-input.json", "--out", "/tmp/verifier-plan.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "verifier-verify", "--spec", "experiments/estate_kernel/verifier.json", "--input", "experiments/estate_kernel/verifier-input.json", "--plan", "/tmp/verifier-plan.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "verifier-run", "--plan", "/tmp/verifier-plan.json", "--out", "/tmp/verifier-report.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "attention-plan", "--requests", "experiments/estate_kernel/attention-requests.json", "--policy", "experiments/estate_kernel/attention-policy.json", "--out", "/tmp/attention-plan.json"],
              [sys.executable, "-m", "tier_runner.estate_kernel", "attention-slo", "--events", "experiments/estate_kernel/attention-events.json", "--out", "/tmp/attention-slo.json"],
          ]
          rows = []
          for index, command in enumerate(commands, 1):
              completed = subprocess.run(command, cwd=root, text=True, capture_output=True)
              rows.append({
                  "index": index,
                  "command": command,
                  "returncode": completed.returncode,
                  "stdout": completed.stdout[-4000:],
                  "stderr": completed.stderr[-4000:],
              })
          result = {
              "schema": "tier-bench/estate-kernel-validation-diagnostic@1",
              "python": sys.version,
              "commands": rows,
              "all_passed": all(row["returncode"] == 0 for row in rows),
          }
          target = root / "transport/estate_kernel_validation.diagnostic.json"
          target.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps({"all_passed": result["all_passed"], "codes": [row["returncode"] for row in rows]}, indent=2))
          PY
      - name: Commit validation diagnostic
        run: |
          git config user.name "Estate Kernel Diagnostic"
          git config user.email "estate-kernel@users.noreply.github.com"
          git add transport/estate_kernel_validation.diagnostic.json
          git diff --cached --quiet || git commit -m "Record Estate Kernel validation diagnostics"
          git push origin HEAD:agent/estate-kernel-v1
