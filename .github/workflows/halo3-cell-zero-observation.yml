name: halo3-cell-zero-observation-floor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-observation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile observation-floor sources
        run: |
          python -m py_compile \
            tier_runner/halo3_cell_common.py \
            tier_runner/halo3_cell_schema.py \
            tier_runner/halo3_cell_plan.py \
            tier_runner/halo3_cell.py \
            tier_runner/halo3_cell_observation.py \
            tests/test_halo3_cell.py \
            tests/test_halo3_cell_observation.py
        shell: bash

      - name: Exercise provider-free refusal and admission laws
        run: |
          python tests/test_halo3_cell.py
          python tests/test_halo3_cell_observation.py
        shell: bash

      - name: Compile exact plan, activations, empty ledger, and checksum manifest
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/halo3-observation-floor"
          mkdir -p "$OUT"

          python -m tier_runner.halo3_cell plan \
            --lab labs/halo3-cell-zero/lab.json \
            --fingerprint labs/halo3-cell-zero/model_fingerprint_contract.json \
            --out "$OUT/plan.json"

          python - "$OUT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          from tier_runner.halo3_cell_common import load_json, write_json
          from tier_runner.halo3_cell_observation import compile_activation, compile_ledger

          out = Path(sys.argv[1])
          plan = load_json(out / "plan.json")
          cell_ids = [
              row["cell_id"] for row in plan["fingerprint_cells"]
          ] + [
              row["cell_id"] for row in plan["stage_cells"]
          ]
          activations = [compile_activation(plan, cell_id) for cell_id in cell_ids]
          assert len(activations) == 66
          assert len({row["activation_id"] for row in activations}) == 66
          assert all(row["production_claim"] is False for row in activations)
          assert all(row["promotion_authorized"] is False for row in activations)

          rendered = json.dumps(activations, sort_keys=True)
          assert '"score"' not in rendered
          assert "aggregate_score" not in rendered

          write_json(out / "activations.json", activations)
          ledger = compile_ledger(plan, [])
          assert ledger["coverage"]["total_cells"] == 66
          assert ledger["coverage"]["measured_cells"] == 0
          assert ledger["coverage"]["unmeasured_cells"] == 66
          assert ledger["complete"] is False
          write_json(out / "empty-ledger.json", ledger)

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          files = {}
          for path in sorted(out.glob("*.json")):
              files[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          write_json(
              out / "manifest.json",
              {
                  "schema": "tier-bench/halo3-observation-floor-artifact@1",
                  "source_head": head,
                  "files": files,
                  "provider_free": True,
                  "physical_qualification": False,
                  "production_claim": False,
              },
          )
          PY

          git diff --check
        shell: bash

      - name: Preserve exact-head observation-floor evidence
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/halo3-observation-floor"
          cp labs/halo3-cell-zero/OBSERVATION_FLOOR.md "$OUT/"
          cp labs/halo3-cell-zero/PROOF_MATRIX.md "$OUT/"
          cp labs/halo3-cell-zero/lab.json "$OUT/"
          cp labs/halo3-cell-zero/model_fingerprint_contract.json "$OUT/"
          cp tier_runner/halo3_cell_observation.py "$OUT/"
          cp tests/test_halo3_cell_observation.py "$OUT/"
          (
            cd "$OUT"
            python - <<'PY'
          import hashlib
          from pathlib import Path

          rows = []
          for path in sorted(Path(".").iterdir()):
              if path.is_file() and path.name != "SHA256SUMS":
                  rows.append(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
                  )
          Path("SHA256SUMS").write_bytes(("\n".join(rows) + "\n").encode("utf-8"))
          PY
          )
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: halo3-observation-floor-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/halo3-observation-floor
          if-no-files-found: error
